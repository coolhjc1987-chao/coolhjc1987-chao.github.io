<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf1f4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0d131a" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="小衣间"><script>/* 离线缓存：只在 https 网址上启用 */if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script></head><body>
<title>小衣间童装定制</title>
<meta name="description" content="1–6 岁童装三维定制：冲锋衣拼色、口袋拉链、内衬、标志，生成商家制作单。">
<script>/* 字体不阻塞渲染：连不上谷歌字体（如国内网络）就用系统字体 */
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap';l.media='print';l.onload=function(){l.media='all'};document.head.appendChild(l)})();</script>
<style>
/* 布局：顶栏 + 左侧三维舞台（桌面粘性全高）+ 右侧定制面板；手机上舞台在上、面板在下 */
:root{
  --bg:#edf1f4; --stage:#e9eff4; --panel:#ffffff; --card:#ffffff; --ink:#1e2b3a; --muted:#677482; --line:#e1e6eb; --soft:#f2f5f8;
  --accent:#ec6a2c; --accent-ink:#ffffff; --brand:#ffc533; --brand-ink:#1e2b3a; --deep:#1f3354; --ok:#2f7d5b; --danger:#c8402f;
  --sky1:#d6e5f1; --sky2:#f3f7fa; --sun:#ffe28c; --glass:rgba(255,255,255,.74); --shadow:0 10px 30px rgba(30,43,58,.10);
  --f-display:"ZCOOL KuaiLe","Noto Sans SC",sans-serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --top:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d131a; --stage:#16202a; --panel:#131b24; --card:#19232e; --ink:#e8edf2; --muted:#94a1ae; --line:#26323e; --soft:#1c2733;
  --accent:#ff8a4c; --accent-ink:#1a0e06; --brand:#ffc533; --brand-ink:#1e2b3a; --deep:#9cc9e0; --ok:#6cc59a; --danger:#ff7b6b;
  --sky1:#1b2938; --sky2:#111a24; --sun:#2a3a50; --glass:rgba(25,35,46,.78); --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d131a; --stage:#16202a; --panel:#131b24; --card:#19232e; --ink:#e8edf2; --muted:#94a1ae; --line:#26323e; --soft:#1c2733;
  --accent:#ff8a4c; --accent-ink:#1a0e06; --brand:#ffc533; --brand-ink:#1e2b3a; --deep:#9cc9e0; --ok:#6cc59a; --danger:#ff7b6b;
  --sky1:#1b2938; --sky2:#111a24; --sun:#2a3a50; --glass:rgba(25,35,46,.78); --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
#app{display:flex;flex-direction:column;min-height:100%}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:var(--top);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--ink);letter-spacing:.02em}
.mark::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:top}
.brand .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.dname{flex:1;min-width:0;display:flex;justify-content:center}
.dname input{width:100%;max-width:280px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;font:600 15px var(--f-body);color:var(--ink);text-align:center}
.dname input:hover,.dname input:focus{border-color:var(--line);background:var(--card)}
.acts{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--ink);color:var(--panel);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.wide{width:100%;padding:12px}
.btn.danger{color:var(--danger)}
.ib{display:inline-grid;place-items:center;min-width:36px;height:36px;border:0;border-radius:999px;background:transparent;color:var(--ink);padding:0 8px}
.ib:hover{background:var(--soft)}
.ib.danger.on{background:var(--danger);color:#fff;font-size:12px;font-weight:600}

/* 舞台 */
.stage{flex:1;display:grid;grid-template-columns:1fr}
.view{position:relative;height:56vh;min-height:360px;background:var(--stage);overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block;cursor:grab}
#cv:active{cursor:grabbing}
.vtag{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:0;pointer-events:none}
.vtag b{font-size:15px}
.vtag span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.vside{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.vside .ib{background:var(--card);box-shadow:0 1px 3px #0002}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.vbar>*{pointer-events:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0002}
.views{background:var(--card);box-shadow:0 2px 8px #0002}
.views button{padding:6px 12px}
.tgl{display:inline-flex;gap:4px;background:var(--card);border-radius:10px;padding:3px;box-shadow:0 2px 8px #0002}
.tgl button{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;border-radius:8px;padding:6px 9px;font-size:12.5px;color:var(--muted)}
.tgl button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tgl button[hidden]{display:none}
.nogl{position:absolute;inset:30% 10% auto;background:var(--card);padding:16px;border-radius:var(--r);text-align:center}

/* 面板 */
.panel{background:var(--panel);border-top:1px solid var(--line);min-width:0}
.tabs{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;border-radius:999px;padding:7px 13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tb{padding:4px 16px 40px}
.sec{padding:16px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:15px;margin:0 0 10px;text-wrap:balance}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{margin:0}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 10px;max-width:62ch}
.safe{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:8px;padding:8px 10px;margin:10px 0 0}
.safe .ic{width:16px;height:16px;margin-top:2px}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 8px}

.types,.lins{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px}
.tcard small{color:var(--muted);font-size:12px}
.tcard[aria-pressed="true"],.tm[aria-pressed="true"],.slot[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.presets{display:grid;grid-template-columns:1fr;gap:8px}
.pcard{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 12px 8px 8px}
.pcard:hover,.tm:hover,.tcard:hover{border-color:var(--muted)}
.pcard small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
.pf{display:block;background:var(--soft);border-radius:8px;padding:4px}
.pf svg{display:block;width:100%;height:auto}
.tmpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tm{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px 6px 8px}
.tm b{font-size:13px;padding:2px 4px 0}
.tm small{font-size:11px;color:var(--muted);padding:0 4px;line-height:1.35}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px 9px}
.slot i{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px #0002}
.slot small{display:block;font-size:11px;color:var(--muted)}
.slot b{font-size:13px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.swc{aspect-ratio:1;border:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0003;position:relative;max-width:100%}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swc.custom{display:grid;place-items:center;background:conic-gradient(#ff6a2b,#f5d33f,#8fd1bd,#3a8fb7,#a594d6,#f3b3c2,#ff6a2b);overflow:hidden;cursor:pointer}
.swc.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swc.custom span{font-weight:700;color:#fff;text-shadow:0 1px 2px #0006}
.mini{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;width:100%}
.swc.s{border-radius:6px}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:7px 0}
.rl{font-size:13px;font-weight:600}
.rl small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.rc{min-width:0}
.rc input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:2px 0;text-align:left}
.knob{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.knob::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px #0003;transition:left .15s}
.sw[aria-pressed="true"] .knob{background:var(--accent)}
.sw[aria-pressed="true"] .knob::after{left:19px}
.swl{font-size:13px}
.swl small{display:block;font-size:11.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field span{font-size:12.5px;font-weight:600}
.field small{font-weight:400;color:var(--muted);margin-left:6px}
.field input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 11px;font:15px var(--f-body);width:100%}
.meas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ages button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ages b{font:700 20px var(--f-mono)}
.ages small{font-size:11px;color:var(--muted)}
.ages button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ages button[aria-pressed="true"] small{color:inherit}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec th,.spec td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.spec th{font-size:11.5px;color:var(--muted);font-weight:600}
.llist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lchip{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px;width:72px;font-size:11px;color:var(--muted)}
.lchip canvas{width:44px;height:44px;background:var(--soft);border-radius:6px}
.lchip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lchip.add{justify-content:center;min-height:72px;border-style:dashed}
.lprev{display:flex;justify-content:center;margin:6px 0 10px}
.lprev canvas{width:260px;max-width:100%;height:auto;border-radius:var(--r)}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:6px 0}
.icn{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:8px;display:grid;place-items:center;padding:7px}
.icn svg{width:100%;height:100%;fill:var(--ink)}
.icn span{font-weight:700;font-size:13px}
.icn[aria-pressed="true"]{background:var(--ink)}
.icn[aria-pressed="true"] svg{fill:var(--panel)}
.icn[aria-pressed="true"] span{color:var(--panel)}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;margin:8px 0;cursor:pointer;color:var(--muted)}
.upload input{display:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pf.big{padding:8px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px #0003}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.two .btn{width:100%;cursor:pointer;text-decoration:none}
.field textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 11px;font:15px var(--f-body);width:100%;resize:vertical}
.fbprev{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:8px;user-select:all}

/* 弹层 */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
.scrim{position:absolute;inset:0;background:#0007}
.sbody{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.docs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.docs li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:6px}
.docs li.cur{border-color:var(--accent)}
.doc{flex:1;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;min-width:0}
.doc img,.nothumb{width:48px;height:60px;object-fit:cover;border-radius:6px;background:var(--soft);flex:none}
.doc small{display:block;color:var(--muted);font-size:12px}
.empty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:28px 10px;color:var(--muted)}
.empty b{color:var(--ink)}
.tp{display:flex;flex-direction:column;height:84vh}
.tpbar{flex-wrap:wrap}
.tpf{flex:1;width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-height:300px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13px;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:959px){
  .view{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:8;height:46vh;min-height:300px;border-bottom:1px solid var(--line)}
  .tabs{top:calc(var(--top) + env(safe-area-inset-top,0px) + max(46vh,300px))}
}
@media (max-width:620px){
  .brand .sub{display:none}
  .acts .btn span{display:none}
  .acts .btn{padding:8px 10px}
  .dname input{font-size:14px}
  .tgl button span{display:none}
  .tgl button{padding:7px}
  .row{grid-template-columns:1fr;gap:6px}
  .tmpls{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media (min-width:960px){
  body{overflow:hidden}
  #app{height:100%}
  .stage{grid-template-columns:minmax(0,1fr) 440px;min-height:0;height:calc(100% - var(--top))}
  .view{height:100%}
  .panel{border-top:0;border-left:1px solid var(--line);overflow-y:auto;height:100%}
  .tabs{top:0}
  .sbody{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);border-radius:16px}
  .sbody:has(.tp){width:min(1100px,94vw)}
  .presets{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.meas{grid-template-columns:repeat(2,minmax(0,1fr))}
.ages{margin:10px 0 4px}
.kidsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.kidsum div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;min-width:0}
.kidsum small{font-size:11.5px;color:var(--muted)}
.kidsum b{font-size:18px;line-height:1.3}
.kidsum span{font-size:11.5px;color:var(--muted)}
.adv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.adv li{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.adv li.ok{background:transparent;border-style:dashed}
.adv li>div{min-width:0}
.adv b{font-size:13.5px}
.adv p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.atag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);margin-right:6px}
.done{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ok);white-space:nowrap}
.done .ic{width:14px;height:14px}

.idea textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:10px 12px;font:15px/1.5 var(--f-body);resize:vertical}
.ideabar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chipbtn{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.chipbtn:hover{border-color:var(--muted);color:var(--ink)}
.ideares{margin-top:10px;font-size:13px;background:var(--soft);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}

#cv{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}

.ib.sm{min-width:28px;height:28px}
.bg{padding:5px 0}

.bchips{display:flex;flex-wrap:wrap;gap:5px}

.bdot{position:absolute;z-index:5;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent);pointer-events:none;animation:bp 1.2s infinite}
@keyframes bp{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--accent) 10%,transparent)}}
.warm{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}

.wt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}

.gauge{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,#3a6fd8,#7fc4e8 40%,#f2d16b 70%,#f07a4a);margin:4px 0 22px}

.fmts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 4px}
.fmts .fl{font-size:12.5px;font-weight:600}
/* 尺寸量法、放松量、生产前检查 */
.spec .how{display:block;font-size:11px;color:var(--muted);line-height:1.4;margin-top:2px}
.pf.meas{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px}.pf.meas svg{display:block;width:100%;height:auto}
.ease{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}.ease span{font-size:12px;background:var(--soft);border-radius:6px;padding:3px 8px}.ease span.tot{background:var(--ink);color:var(--bg)}
.tag.warn{background:#ffe3d3;color:#9a3a0c}
.checks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}

.checks .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 "IBM Plex Mono",monospace;background:var(--soft);color:var(--muted)}
.checks li.warn .ci{background:#ff6a2b;color:#fff}
.checks p{margin:0;font-size:13px;line-height:1.55}.checks button{grid-column:2;justify-self:start}
/* 冲突选项：置灰，点了提示原因 */
[aria-disabled="true"]{cursor:not-allowed}
.seg button[aria-disabled="true"],.bchip[aria-disabled="true"]{opacity:.38;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.tcard[aria-disabled="true"]{opacity:.42;filter:grayscale(1);border-style:dashed}
.sw[aria-disabled="true"] .knob{opacity:.4}.sw[aria-disabled="true"] .swl{color:var(--muted)}
.sw small.why{color:#b5541f}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pstat{display:grid;gap:2px;border:1.5px dashed #f0b48f;border-radius:var(--r);padding:10px 12px;margin:6px 0 4px;background:color-mix(in srgb,#ff6a2b 6%,var(--card))}.pstat b{font-size:14px}.pstat span{font-size:12.5px;color:var(--muted);line-height:1.5}
.pstat.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.checks li.hard{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--card))}.checks li.hard .ci{background:var(--danger);color:#fff}
.checks li.vdone{opacity:.75}.checks li.vdone .ci{background:var(--ok);color:#fff}
.checks .cbtn{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}.checks .cbtn button{grid-column:auto}
.hoodtech{margin:6px 0 10px}.hoodtech summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0;color:var(--ink)}
.mrange{display:flex;align-items:center;gap:8px;width:100%}.mrange input{flex:1}.mrange small{font-size:11px;color:var(--muted);white-space:nowrap}
.lmove{border-left:3px solid var(--soft);padding-left:8px;margin:4px 0}.note.warnt{color:#b5541f}
h3.sub{font-size:13.5px;margin:14px 0 4px}h3.sub small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
details.grade{margin-top:10px}details.grade summary{cursor:pointer;font-size:13px;font-weight:600;padding:6px 0}
.gwrap{overflow-x:auto;margin:0 -2px}.spec.grade{min-width:520px;font-size:12px}.spec.grade th,.spec.grade td{padding:5px 4px;white-space:nowrap}

/* ======== 视觉层：雨衣黄 · 晴空舞台 ======== */
body{font-size:14px;letter-spacing:.01em}
::selection{background:var(--brand);color:var(--brand-ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
/* 顶栏 */
.top{background:var(--bg);border-bottom:0;padding:10px 18px;gap:14px}
.brand{align-items:center;gap:12px}
.mark{font-size:28px;letter-spacing:.04em;white-space:nowrap}
.mark::after{width:10px;height:10px;background:var(--brand);box-shadow:0 0 0 2px var(--bg);margin-left:3px;vertical-align:6px}
.brand .sub{font-family:var(--f-body);font-size:12.5px;letter-spacing:0;color:var(--muted);padding-left:12px;border-left:1px solid var(--line)}
.dname input{font-size:15px;font-weight:700;border-radius:12px}
.dname input:hover,.dname input:focus{background:var(--card);border-color:var(--line)}
.btn{border-radius:999px;padding:9px 16px;font-weight:700;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.cta{background:var(--brand);color:var(--brand-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.10)}

.ib{border-radius:12px}
/* 舞台 */
.view{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 72%);isolation:isolate}
.view .sun{position:absolute;left:50%;top:44%;width:min(54%,58vh);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 42% 38%,color-mix(in srgb,var(--sun) 55%,#fff) 0,var(--sun) 58%);box-shadow:0 0 0 18px color-mix(in srgb,var(--sun) 28%,transparent),0 0 0 44px color-mix(in srgb,var(--sun) 12%,transparent);transition:background .4s,box-shadow .4s}
.view.night{background:linear-gradient(180deg,#121b2b 0%,#0a0f18 75%)}
.view.night .sun{background:radial-gradient(circle at 40% 36%,#f4f7fc 0,#c3cfe0 62%);width:min(13%,13vh);top:20%;left:74%;box-shadow:0 0 50px 12px rgba(201,212,228,.16)}
#cv{position:relative;z-index:1}
.vtag{left:20px;top:18px;gap:2px;z-index:2}
.vtag b{font-family:var(--f-display);font-size:24px;font-weight:400;line-height:1.15;letter-spacing:.03em}
.vtag span{font-family:var(--f-body);font-size:12.5px;color:var(--muted)}
.vtag .temp{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:8px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px 11px 3px 9px;font:700 13px var(--f-num);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.vtag .temp::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(90deg,#4aa3df,#ffb02e,#ef5b2c)}

.view.night .vtag b,.view.night .vtag span{color:#e8edf2}
.vside{right:16px;top:16px;gap:8px;z-index:2}

.vbar{z-index:2;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.seg.views,.tgl{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.55);border-radius:999px;padding:4px}
.views button,.tgl button{border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink);font-weight:500}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700;box-shadow:none}
.tgl button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
/* 面板与标签 */
.panel{background:var(--panel)}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(54px,1fr));gap:0;padding:10px 8px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;border-radius:0;font-size:12px;font-weight:600;color:var(--muted);background:transparent}
.tabs button .ic{width:44px;height:28px;padding:4px 12px;border-radius:999px;stroke-width:1.9;transition:background .15s}
.tabs button:hover .ic{background:var(--soft)}
.tabs button[aria-selected="true"]{background:transparent;color:var(--ink);font-weight:800}
.tabs button[aria-selected="true"] .ic{background:var(--brand);color:var(--brand-ink)}
.tb{padding:6px 22px 48px}
.sec{padding:22px 0;border-bottom:1px solid var(--line)}
.sec h2{font-size:17px;font-weight:800;letter-spacing:.01em;margin-bottom:12px}
.sh{margin-bottom:12px}
.note{font-size:13px;line-height:1.6}
.tag{border-radius:999px;padding:3px 10px;font-weight:600}
/* 控件 */
.seg{background:var(--soft);border-radius:12px;padding:3px}
.seg button{border-radius:9px;padding:7px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(30,43,58,.16),0 0 0 1px rgba(30,43,58,.04)}
.row{padding:9px 0}
.rl{font-weight:700}
.knob{background:color-mix(in srgb,var(--muted) 35%,var(--line))}
.sw[aria-pressed="true"] .knob{background:var(--ink)}
.rc input[type=range],input[type=range]{accent-color:var(--ink)}
.field span{font-weight:700}
.field input,.field textarea,.idea textarea{background:var(--soft);border:1.5px solid transparent;border-radius:12px;transition:border-color .15s,background .15s}
.field input:focus,.field textarea:focus,.idea textarea:focus{background:var(--card);border-color:var(--ink);outline:none}
/* 选择卡片：选中 = 深色描边 + 一点雨衣黄 */
.tcard,.tm,.slot,.pcard,.hm,.pt,.lchip,.icn,.ages button{border:1px solid var(--line);transition:border-color .12s,box-shadow .12s,background .12s}
.tcard,.tm,.slot,.hm{border-radius:16px}
.pcard{border-radius:20px;padding:10px 14px 10px 10px}
.pcard:hover,.tm:hover,.tcard:hover,.hm:hover{border-color:color-mix(in srgb,var(--ink) 35%,var(--line));box-shadow:var(--shadow)}
.tcard[aria-pressed="true"],.tm[aria-pressed="true"],.slot[aria-pressed="true"],.pt[aria-pressed="true"],.lchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:color-mix(in srgb,var(--brand) 13%,var(--card))}
.pf{border-radius:12px}
.ages{gap:8px}
.ages button{border-radius:16px;padding:9px 0 7px}

.icn{border-radius:12px}
.icn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.kidsum div{border-radius:16px;background:var(--soft);border-color:transparent}
.kidsum b{font-family:var(--f-num);font-size:22px;font-weight:800}
.kidsum b.mono{font-size:22px}
.adv li,.checks li{border-radius:16px}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.chipbtn{border-style:solid;background:var(--soft);border-color:transparent}
.chipbtn:hover{background:var(--card);border-color:var(--line)}
.spec th{font-weight:700}
.bubble{border-radius:20px;box-shadow:0 18px 40px rgba(30,43,58,.22),0 0 0 1px var(--line)}
.bchip{border-radius:999px}
.sbody{border-radius:24px 24px 0 0}
#toast{background:var(--ink);font-weight:600}
@media (min-width:960px){

}

}

/* 面料页 */
.tabs{grid-template-columns:repeat(8,minmax(50px,1fr))}
.recs{display:grid;gap:10px;margin-top:12px}

.rec .rsw canvas:first-child{grid-column:1/3;width:84px;height:44px}

.rt{display:flex;align-items:center;flex-wrap:wrap;gap:6px}

.rmix{margin:3px 0 0;font-size:12.5px;color:var(--ink);font-weight:500}

.rbars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;margin-top:8px}

.fab[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:color-mix(in srgb,var(--brand) 13%,var(--card))}

.fdet .dl{margin-top:10px;font-size:12.5px}

.fcmpt{min-width:520px;font-size:12px}.fcmpt td,.fcmpt th{padding:6px 5px;white-space:nowrap}
.fcmpt .dots{color:var(--ink);letter-spacing:-1px;font-size:10px}.fcmpt .dots span{color:var(--line)}

/* iPhone：刘海安全区、横屏、主屏安装提示 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.top{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

@media (orientation:landscape) and (max-height:520px) and (max-width:959px){

function renorm(n){for(let i=0;i<n.length;i+=3){const l=Math.hypot(n[i],n[i+1],n[i+2])||1;n[i]/=l;n[i+1]/=l;n[i+2]/=l}return n}
function merge(list){let nv=0,ni=0;list.forEach(g=>{nv+=g.pos.length/3;ni+=g.idx.length});
  const pos=new Float32Array(nv*3),nrm=new Float32Array(nv*3),uv=new Float32Array(nv*2),idx=new Uint32Array(ni);let ov=0,oi=0;
  for(const g of list){pos.set(g.pos,ov*3);nrm.set(g.nrm,ov*3);uv.set(g.uv,ov*2);for(let i=0;i<g.idx.length;i++)idx[oi+i]=g.idx[i]+ov;ov+=g.pos.length/3;oi+=g.idx.length}
  return {pos,nrm,uv,idx}}
function transformGeo(g,m){const pos=new Float32Array(g.pos.length),nrm=new Float32Array(g.nrm.length);
  for(let i=0;i<g.pos.length;i+=3){const x=g.pos[i],y=g.pos[i+1],z=g.pos[i+2];
    pos[i]=m[0]*x+m[4]*y+m[8]*z+m[12];pos[i+1]=m[1]*x+m[5]*y+m[9]*z+m[13];pos[i+2]=m[2]*x+m[6]*y+m[10]*z+m[14];
    const a=g.nrm[i],b=g.nrm[i+1],c=g.nrm[i+2];nrm[i]=m[0]*a+m[4]*b+m[8]*c;nrm[i+1]=m[1]*a+m[5]*b+m[9]*c;nrm[i+2]=m[2]*a+m[6]*b+m[10]*c}
  return {pos,nrm:renorm(nrm),uv:g.uv,idx:g.idx}}
function ellipsoid(c,r,nu=28,nv=18){return surface(nu,nv,(u,v)=>{const a=u*2*Math.PI,b=v*Math.PI;return [c[0]+r[0]*Math.sin(b)*Math.sin(a),c[1]+r[1]*Math.cos(b),c[2]+r[2]*Math.sin(b)*Math.cos(a)]},{closeU:true})}
function lathe(prof,nu=64){const n=prof.length;return surface(nu,n-1,(u,v)=>{const i=Math.round(v*(n-1)),[r,y]=prof[i],a=u*2*Math.PI;return [r*Math.sin(a),y,r*Math.cos(a)]},{closeU:true})}
function roundBox(w,h,d,r=.3){ // 圆角盒（超椭球）
  return surface(24,16,(u,v)=>{const a=u*2*Math.PI,b=v*Math.PI,e=r;const sp=(x,p)=>Math.sign(x)*Math.pow(Math.abs(x),p);
    return [w*sp(Math.sin(b),e)*sp(Math.sin(a),e),h*sp(Math.cos(b),e),d*sp(Math.sin(b),e)*sp(Math.cos(a),e)]},{closeU:true})}
// 沿路径的管状体：pts 点列，rad(t) 半径，可选 uv 周向起点 refUp
function tube(pts,rad,{nu=20,closeEnds=false,refUp=[0,1,0]}={}){
  const n=pts.length,frames=[];let T0=V3.norm(V3.sub(pts[1],pts[0]));let Nn=V3.norm(V3.cross(V3.cross(T0,refUp),T0));if(!isFinite(Nn[0])||V3.len(Nn)<.5)Nn=[1,0,0];
  for(let i=0;i<n;i++){const T=V3.norm(V3.sub(pts[Math.min(n-1,i+1)],pts[Math.max(0,i-1)]));Nn=V3.norm(V3.sub(Nn,V3.scale(T,V3.dot(Nn,T))));frames.push([T,Nn,V3.cross(T,Nn)])}
  return surface(nu,n-1,(u,v)=>{const fi=v*(n-1),i=Math.min(n-1,Math.round(fi));const [T,N,B]=frames[i];const a=u*2*Math.PI,r=rad(v,u);
    return V3.add(pts[i],V3.add(V3.scale(N,Math.cos(a)*r),V3.scale(B,Math.sin(a)*r)))},{closeU:true});
}

const curve=(fn,a,b,n=40)=>{const o=[];for(let i=0;i<=n;i++){const u=a+(b-a)*i/n;o.push([u,fn(u)])}return o};

      lines.push([[-.03,vv(.84)],[1.03,vv(.84)]],[[-.03,vv(.56)],[1.03,vv(.56)]]);S.push({band:true});break;

    case 'halfsplit': B.push({c:'acc1',pts:[[.004,-.1],[.5,-.1],[.5,1.1],[.004,1.1]]});lines.push([[.5,-.02],[.5,1.02]]);S.push({c:'acc1',side:'L',pts:[[0,-.1],[1,-.1],[1,1.1],[0,1.1]]});break;

function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true});return c}

    else if(o.type==='hood'){tape(w*.4,0,w*.4,h);tape(w*.6,0,w*.6,h)}else if(o.type==='sleeve'){tape(w*.5,0,w*.5,h)}}
  if(t==='cotton'){x.strokeStyle='rgba(0,0,0,.05)';x.lineWidth=1;for(let i=0;i<w;i+=4){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}}
  if(t==='quilted'){x.strokeStyle='rgba(0,0,0,.16)';x.lineWidth=2;const s=w/14;for(let i=-h;i<w+h;i+=s){x.beginPath();x.moveTo(i,0);x.lineTo(i+h,h);x.stroke();x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke()}}
  if(t==='taffeta'){const gr=x.createLinearGradient(0,0,w,0);gr.addColorStop(0,'rgba(255,255,255,.06)');gr.addColorStop(.5,'rgba(0,0,0,.04)');gr.addColorStop(1,'rgba(255,255,255,.06)');x.fillStyle=gr;x.fillRect(0,0,w,h)}
  if(t==='print'){const ic=['star','paw','dino','heart','mountain'];const cols=[cfg.colors.acc1,cfg.colors.acc2,cfg.colors.main];const s=60;
    for(let j=0;j<h/s+1;j++)for(let i=0;i<w/s+1;i++){if(r()<.35)continue;const k=ic[(i*3+j*7)%ic.length];x.save();x.translate(i*s+(j%2)*s/2,j*s);x.rotate((r()-.5)*.8);x.scale(s/180,s/180);x.translate(-50,-50);x.fillStyle=cols[(i+j)%3];x.globalAlpha=.8;x.fill(new Path2D(ICONS[k].d));x.restore()}}

  if(o.type==='torso'&&o.facing){const fw=o.facing*w;// 门襟贴边（面料色）
    for(const [x0,x1] of [[0,fw],[w-fw,w]]){for(let j=0;j<32;j++){const v0=j/32;x.fillStyle=o.mainAt(x0<1?.01:.99,1-v0-1/64);x.fillRect(x0,v0*h,x1-x0,h/32+1)}
      x.strokeStyle='rgba(0,0,0,.3)';x.setLineDash([4,3]);x.beginPath();const xx=x0<1?x1-4:x0+4;x.moveTo(xx,0);x.lineTo(xx,h);x.stroke();x.setLineDash([])}
    // 内侧下摆贴边

      x.fillStyle='#2b3440';x.font=`700 ${lh*.42}px "ZCOOL KuaiLe","Noto Sans SC",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(cfg.nameLabel.slice(0,8),0,-lh*.08);x.font=`${lh*.18}px "IBM Plex Mono",monospace`;x.fillStyle='#7a8592';x.fillText('LITTLE WEAR · '+cfg.meas.height+'cm',0,lh*.3);x.restore()}}

      x.fillStyle='rgba(255,255,255,.75)';x.fillRect(cx-pw*.36,cy-ph*.2,pw*.72,ph*.5);x.save();x.translate(cx,cy+ph*.06);x.scale(-1,1);x.fillStyle='#2b3440';x.font=`700 ${ph*.17}px "Noto Sans SC",sans-serif`;x.textAlign='center';x.fillText('紧急联系卡',0,0);x.restore()}

// —— 模特头部贴图：脸（眼睛、腮红、笑嘴）+ 头发遮罩 ——
// 头部参数：u=0.5 为正脸，v=0 头顶；贴图上下颠倒（画布 y = (1-v)·h）
let HEAD_TEX=null;
function headTextures(){if(HEAD_TEX)return HEAD_TEX;const W=1024,H=512;const X=u=>u*W,Y=v=>(1-v)*H;
  const face=mkCanvas(W,H),f=face.getContext('2d');f.fillStyle='#f6d6c1';f.fillRect(0,0,W,H);
  // 肤色微渐变：脸颊暖一点
  let g=f.createRadialGradient(X(.5),Y(.6),10,X(.5),Y(.6),260);g.addColorStop(0,'rgba(255,236,224,.6)');g.addColorStop(1,'rgba(255,236,224,0)');f.fillStyle=g;f.fillRect(0,0,W,H);
  // 画在“正脸”局部坐标里：上下翻转
  f.save();f.translate(X(.5),Y(.57));
  // 腮红
  for(const s of [-1,1]){const gg=f.createRadialGradient(s*112,-30,2,s*112,-30,34);gg.addColorStop(0,'rgba(247,140,140,.62)');gg.addColorStop(1,'rgba(247,140,140,0)');f.fillStyle=gg;f.beginPath();f.ellipse(s*112,-30,40,26,0,0,7);f.fill()}
  // 眼睛：深色椭圆 + 两个高光
  for(const s of [-1,1]){f.fillStyle='#2b2230';f.beginPath();f.ellipse(s*62,6,17,22,0,0,7);f.fill();
    f.fillStyle='#55405e';f.beginPath();f.ellipse(s*62,-1,11,12,0,0,7);f.fill();
    f.fillStyle='#ffffff';f.beginPath();f.arc(s*62-5,15,6.5,0,7);f.fill();f.beginPath();f.arc(s*62+7,-7,3,0,7);f.fill();
    // 眉毛
    f.strokeStyle='rgba(90,59,44,.55)';f.lineWidth=4;f.lineCap='round';f.beginPath();f.arc(s*62,32,14,Math.PI*.25,Math.PI*.75);f.stroke()}
  // 小嘴：微张的笑
  f.fillStyle='#9a4038';f.beginPath();f.moveTo(-15,-38);f.quadraticCurveTo(0,-41,15,-38);f.quadraticCurveTo(13,-56,0,-57);f.quadraticCurveTo(-13,-56,-15,-38);f.fill();
  f.fillStyle='#f08f86';f.beginPath();f.ellipse(0,-51,8,5,0,0,7);f.fill();
  // 小鼻子
  f.fillStyle='rgba(222,150,125,.55)';f.beginPath();f.ellipse(0,-16,5,3.5,0,0,7);f.fill();
  f.restore();
  // 光泽贴图：皮肤半哑光，眼睛高光
  const pm=mkCanvas(W,H),p=pm.getContext('2d');p.fillStyle='rgb(120,0,40)';p.fillRect(0,0,W,H);
  p.save();p.translate(X(.5),Y(.57));p.fillStyle='rgb(25,0,230)';for(const s of [-1,1]){p.beginPath();p.ellipse(s*62,6,17,22,0,0,7);p.fill()}p.restore();
  // 头发遮罩：刘海三缕、鬓角到耳上、后面到后颈
  const hair=mkCanvas(W,H),h=hair.getContext('2d');h.clearRect(0,0,W,H);
  const hairEnd=u=>{const d=Math.abs(u-.5);if(d<.13){const k=(u-.37)/.26*3;const fr=k-Math.floor(k);return .345+.05*Math.sin(Math.PI*fr)+.02*Math.pow(d/.13,2)}
    const t1=Math.min(1,(d-.13)/.12),t2=Math.max(0,(d-.25)/.25);return d<.25?lerp(.37,.47,t1*t1*(3-2*t1)):lerp(.47,.73,t2*t2*(3-2*t2))};
  for(let i=0;i<W;i++){const u=(i+.5)/W,ve=hairEnd(u);h.fillStyle='#d8d8d8';h.fillRect(i,Y(ve),1,H-Y(ve))}
  // 发丝高光带与发缝
  h.globalCompositeOperation='source-atop';
  const hb=h.createLinearGradient(0,Y(.12),0,Y(.3));hb.addColorStop(0,'rgba(255,255,255,0)');hb.addColorStop(.5,'rgba(255,255,255,.9)');hb.addColorStop(1,'rgba(255,255,255,0)');h.fillStyle=hb;h.fillRect(0,Y(.3),W,Y(.12)-Y(.3));
  h.strokeStyle='rgba(120,120,120,.5)';h.lineWidth=2;for(let k=0;k<26;k++){const u=k/26;h.beginPath();h.moveTo(X(u),H);h.quadraticCurveTo(X(u+.01),Y(.2),X(u+.02),Y(hairEnd(u+.02)));h.stroke()}
  h.globalCompositeOperation='source-over';
  return HEAD_TEX={face,pm,hair}}

function fabSwatch(cv,k,hex){const x=cv.getContext('2d'),W=cv.width,H=cv.height;x.fillStyle=hex;x.fillRect(0,0,W,H);

  c.logos.forEach((L,i)=>{if(L.place!=='chestL'&&L.place!=='chestR')return;const g=logoGeo(c,L),inner=g.x-L.size/2;const flap=c.zipFlap&&c.zipLen!=='none'&&((c.flapSide==='L')===(L.place==='chestL'));const need=flap?5:2.5;

    case 'chestPocket':return v!=='none'&&c.zipLen!=='none'&&c.zipPos==='offset'?'偏襟拉链在左胸，放不下胸袋；先把拉链改回居中':'';

    const url=c.toDataURL('image/png');const im2=new Image();im2.onload=()=>{snap();const L=cfg.logos[ui.logo];L.kind='image';L.img=url;L._im=im2;afterChange();toast('图片已放到衣服上')};im2.src=url};im.onerror=()=>toast('这张图片打不开，换一张试试');im.src=r.result};r.readAsDataURL(file)}
function readImg(file,max,cb){if(!file.type.startsWith('image/')){toast('请选择图片文件');return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=mkCanvas(Math.round(im.width*s),Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const url=c.toDataURL('image/png');const im2=new Image();im2.onload=()=>cb(url,im2);im2.src=url};im.onerror=()=>toast('这张图片打不开，换一张试试');im.src=r.result};r.readAsDataURL(file)}

const MIME={pdf:'application/pdf',png:'image/png',html:'text/html',csv:'text/csv',json:'application/json'};
const mimeOf=n=>MIME[(n.split('.').pop()||'').toLowerCase()]||'application/octet-stream';
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const NATIVE=()=>window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.lwSave;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b)});
async function saveFile(name,data){if(dl){try{await dl.save({filename:name,data});toast('已保存：'+name)}catch(e){if(e&&e.code==='declined')return;toast('文件没有保存：'+(e&&e.message||'当前环境不支持下载'))}return}
  const blob=data instanceof Blob?data:new Blob([data],{type:mimeOf(name)});
  // iPhone App：交给系统分享面板（存到“文件”、发微信、隔空投送）
  const nb=NATIVE();if(nb){try{nb.postMessage({name,mime:blob.type||mimeOf(name),b64:await blobToB64(blob)})}catch(e){toast('文件没有保存，请再试一次')}return}
  // iPhone / iPad 浏览器：优先用系统分享
  if(IS_IOS&&navigator.canShare){const file=new File([blob],name,{type:blob.type||mimeOf(name)});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return;shareLater(file);return}}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast('当前环境不支持下载')}}

  <button class="btn wide cta" id="sharenow">${ic('share')}<span>保存或分享</span></button></div>`);
  $('#sharenow').onclick=async()=>{try{await navigator.share({files:[file],title:file.name});closeSheet()}catch(e){if(e&&e.name!=='AbortError'){const u=URL.createObjectURL(file);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}}}}

const cellText=v=>{if(v==null)return '';if(typeof v==='object')return v.num!=null?String(v.num):'';v=String(v);if(v.startsWith('§'))return v.split('§').filter(Boolean).map(h=>{const i=colorInfo(h.trim());return `${i.name} ${i.code} ${h.trim().toUpperCase()}`}).join(' / ');return v};
function techPackHTML(M){const c=cfg;
  const cell=v=>{if(v&&typeof v==='object'){if(v.num!=null)return `<span class="n">${v.num}</span>`;if(v.img)return `<img class="lg" src="${v.img}" alt="">`;return ''}v=String(v??'');
    if(v.startsWith('§'))return v.split('§').filter(Boolean).map(h=>{h=h.trim();const x=colorInfo(h);return `<span class="cc"><i style="background:${h}"></i>${x.name}<em>${x.code} · ${h.toUpperCase()}</em></span>`}).join('<br>');
    if(/^【/.test(v))return `<b>${esc(v)}</b>`;return esc(v)};

    case 'svgs':return `<div class="flats">${B.items.map(f=>`<div>${f.svg}<p>${esc(f.cap)}</p></div>`).join('')}</div>`;
    case 'table':return `<table>${B.cols?`<colgroup>${B.cols.map(w=>`<col style="width:${(w*100).toFixed(1)}%">`).join('')}</colgroup>`:''}${B.head?`<thead><tr>${B.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>`:''}<tbody>${B.rows.map(r=>`<tr${typeof r[0]==='string'&&/^【/.test(r[0])?' class="grp"':''}>${r.map(v=>`<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
