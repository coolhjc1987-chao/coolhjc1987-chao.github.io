<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2526"></head><body>
<title>小衣间童装定制</title>
<meta name="description" content="1–6 岁童装三维定制：冲锋衣拼色、口袋拉链、内衬、标志，生成商家制作单。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：顶栏 + 左侧三维舞台（桌面粘性全高）+ 右侧定制面板；手机上舞台在上、面板在下 */
:root{
  --bg:#e9ece6; --stage:#e3e7e0; --panel:#f9faf7; --card:#ffffff; --ink:#1b2526; --muted:#5d6864; --line:#d3d8cf; --soft:#eef1eb;
  --accent:#ff6a2b; --accent-ink:#ffffff; --deep:#1f3354; --ok:#2f7d5b; --danger:#c0392b;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC",sans-serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --top:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101413; --stage:#161b19; --panel:#131817; --card:#1b2120; --ink:#e6eae4; --muted:#98a29d; --line:#2a322f; --soft:#1e2523;
  --accent:#ff7a3d; --accent-ink:#1a0e06; --deep:#9cc9e0; --ok:#6cc59a; --danger:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101413; --stage:#161b19; --panel:#131817; --card:#1b2120; --ink:#e6eae4; --muted:#98a29d; --line:#2a322f; --soft:#1e2523;
  --accent:#ff7a3d; --accent-ink:#1a0e06; --deep:#9cc9e0; --ok:#6cc59a; --danger:#ff7b6b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;min-height:100%}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:var(--top);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--ink);letter-spacing:.02em}
.mark::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:top}
.brand .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.dname{flex:1;min-width:0;display:flex;justify-content:center}
.dname input{width:100%;max-width:280px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;font:600 15px var(--f-body);color:var(--ink);text-align:center}
.dname input:hover,.dname input:focus{border-color:var(--line);background:var(--card)}
.acts{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;background:var(--ink);color:var(--panel);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.wide{width:100%;padding:12px}
.btn.danger{color:var(--danger)}
.ib{display:inline-grid;place-items:center;min-width:36px;height:36px;border:0;border-radius:999px;background:transparent;color:var(--ink);padding:0 8px}
.ib:hover{background:var(--soft)}
.ib.danger.on{background:var(--danger);color:#fff;font-size:12px;font-weight:600}

/* 舞台 */
.stage{flex:1;display:grid;grid-template-columns:1fr}
.view{position:relative;height:56vh;min-height:360px;background:var(--stage);overflow:hidden;touch-action:none}
#cv{width:100%;height:100%;display:block;cursor:grab}
#cv:active{cursor:grabbing}
.vtag{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:0;pointer-events:none}
.vtag b{font-size:15px}
.vtag span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.vside{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.vside .ib{background:var(--card);box-shadow:0 1px 3px #0002}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.vbar>*{pointer-events:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px #0002}
.views{background:var(--card);box-shadow:0 2px 8px #0002}
.views button{padding:6px 12px}
.tgl{display:inline-flex;gap:4px;background:var(--card);border-radius:10px;padding:3px;box-shadow:0 2px 8px #0002}
.tgl button{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;border-radius:8px;padding:6px 9px;font-size:12.5px;color:var(--muted)}
.tgl button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tgl button[hidden]{display:none}
.nogl{position:absolute;inset:30% 10% auto;background:var(--card);padding:16px;border-radius:var(--r);text-align:center}

/* 面板 */
.panel{background:var(--panel);border-top:1px solid var(--line);min-width:0}
.tabs{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:10;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;border-radius:999px;padding:7px 13px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tb{padding:4px 16px 40px}
.sec{padding:16px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:15px;margin:0 0 10px;text-wrap:balance}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{margin:0}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 10px;max-width:62ch}
.safe{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:8px;padding:8px 10px;margin:10px 0 0}
.safe .ic{width:16px;height:16px;margin-top:2px}
.tag{font-size:12px;background:var(--soft);border-radius:6px;padding:2px 8px}

.types,.lins{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px}
.tcard small{color:var(--muted);font-size:12px}
.tcard[aria-pressed="true"],.tm[aria-pressed="true"],.slot[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.presets{display:grid;grid-template-columns:1fr;gap:8px}
.pcard{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 12px 8px 8px}
.pcard:hover,.tm:hover,.tcard:hover{border-color:var(--muted)}
.pcard small{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px}
.pf{display:block;background:var(--soft);border-radius:8px;padding:4px}
.pf svg{display:block;width:100%;height:auto}
.tmpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tm{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px 6px 8px}
.tm b{font-size:13px;padding:2px 4px 0}
.tm small{font-size:11px;color:var(--muted);padding:0 4px;line-height:1.35}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:7px 9px}
.slot i{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 1px #0002}
.slot small{display:block;font-size:11px;color:var(--muted)}
.slot b{font-size:13px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.swc{aspect-ratio:1;border:0;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px #0003;position:relative;max-width:100%}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swc.custom{display:grid;place-items:center;background:conic-gradient(#ff6a2b,#f5d33f,#8fd1bd,#3a8fb7,#a594d6,#f3b3c2,#ff6a2b);overflow:hidden;cursor:pointer}
.swc.custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swc.custom span{font-weight:700;color:#fff;text-shadow:0 1px 2px #0006}
.mini{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;width:100%}
.swc.s{border-radius:6px}
.row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:7px 0}
.rl{font-size:13px;font-weight:600}
.rl small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.rc{min-width:0}
.rc input[type=range]{width:100%;accent-color:var(--accent)}
.sw{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:2px 0;text-align:left}
.knob{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.knob::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px #0003;transition:left .15s}
.sw[aria-pressed="true"] .knob{background:var(--accent)}
.sw[aria-pressed="true"] .knob::after{left:19px}
.swl{font-size:13px}
.swl small{display:block;font-size:11.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.field span{font-size:12.5px;font-weight:600}
.field small{font-weight:400;color:var(--muted);margin-left:6px}
.field input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 11px;font:15px var(--f-body);width:100%}
.meas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ages button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ages b{font:700 20px var(--f-mono)}
.ages small{font-size:11px;color:var(--muted)}
.ages button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ages button[aria-pressed="true"] small{color:inherit}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec th,.spec td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.spec th{font-size:11.5px;color:var(--muted);font-weight:600}
.llist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.lchip{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px;width:72px;font-size:11px;color:var(--muted)}
.lchip canvas{width:44px;height:44px;background:var(--soft);border-radius:6px}
.lchip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lchip.add{justify-content:center;min-height:72px;border-style:dashed}
.lprev{display:flex;justify-content:center;margin:6px 0 10px}
.lprev canvas{width:260px;max-width:100%;height:auto;border-radius:var(--r)}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:6px 0}
.icn{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:8px;display:grid;place-items:center;padding:7px}
.icn svg{width:100%;height:100%;fill:var(--ink)}
.icn span{font-weight:700;font-size:13px}
.icn[aria-pressed="true"]{background:var(--ink)}
.icn[aria-pressed="true"] svg{fill:var(--panel)}
.icn[aria-pressed="true"] span{color:var(--panel)}
.upload{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;margin:8px 0;cursor:pointer;color:var(--muted)}
.upload input{display:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pf.big{padding:8px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip i{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px #0003}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.two .btn{width:100%;cursor:pointer;text-decoration:none}
.field textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 11px;font:15px var(--f-body);width:100%;resize:vertical}
.fbprev{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:8px;user-select:all}

/* 弹层 */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
.scrim{position:absolute;inset:0;background:#0007}
.sbody{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);border-radius:16px 16px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.docs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.docs li{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:6px}
.docs li.cur{border-color:var(--accent)}
.doc{flex:1;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;min-width:0}
.doc img,.nothumb{width:48px;height:60px;object-fit:cover;border-radius:6px;background:var(--soft);flex:none}
.doc small{display:block;color:var(--muted);font-size:12px}
.empty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:28px 10px;color:var(--muted)}
.empty b{color:var(--ink)}
.tp{display:flex;flex-direction:column;height:84vh}
.tpbar{flex-wrap:wrap}
.tpf{flex:1;width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;min-height:300px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:999px;font-size:13px;transition:.2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:959px){
  .view{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:8;height:46vh;min-height:300px;border-bottom:1px solid var(--line)}
  .tabs{top:calc(var(--top) + env(safe-area-inset-top,0px) + max(46vh,300px))}
}
@media (max-width:620px){
  .brand .sub{display:none}
  .acts .btn span{display:none}
  .acts .btn{padding:8px 10px}
  .dname input{font-size:14px}
  .tgl button span{display:none}
  .tgl button{padding:7px}
  .row{grid-template-columns:1fr;gap:6px}
  .tmpls{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media (min-width:960px){
  body{overflow:hidden}
  #app{height:100%}
  .stage{grid-template-columns:minmax(0,1fr) 440px;min-height:0;height:calc(100% - var(--top))}
  .view{height:100%}
  .panel{border-top:0;border-left:1px solid var(--line);overflow-y:auto;height:100%}
  .tabs{top:0}
  .sbody{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);border-radius:16px}
  .sbody:has(.tp){width:min(1100px,94vw)}
  .presets{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.meas{grid-template-columns:repeat(2,minmax(0,1fr))}
.ages{margin:10px 0 4px}
.kidsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.kidsum div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;min-width:0}
.kidsum small{font-size:11.5px;color:var(--muted)}
.kidsum b{font-size:18px;line-height:1.3}
.kidsum span{font-size:11.5px;color:var(--muted)}
.adv{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.adv li{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.adv li.ok{background:transparent;border-style:dashed}
.adv li>div{min-width:0}
.adv b{font-size:13.5px}
.adv p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.atag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);margin-right:6px}
.done{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ok);white-space:nowrap}
.done .ic{width:14px;height:14px}

</style>

const M4 = {

  mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o},
  persp(fov,asp,n,f){const t=1/Math.tan(fov/2),m=new Float32Array(16);m[0]=t/asp;m[5]=t;m[10]=(f+n)/(n-f);m[11]=-1;m[14]=2*f*n/(n-f);return m},

const VS = `#version 300 es

const FS = `#version 300 es

uniform float uRough, uSpec, uSheen, uNStr, uDStr, uWrap, uNight, uOpacity, uShadowOn;

mat3 cotFrame(vec3 N, vec3 p, vec2 uv){
  vec3 dp1=dFdx(p), dp2=dFdy(p); vec2 du1=dFdx(uv), du2=dFdy(uv);
  vec3 d2p=cross(dp2,N), d1p=cross(N,dp1);

  float im=inversesqrt(max(max(dot(T,T),dot(B,B)),1e-12)); return mat3(T*im,B*im,N);
}
float shadowAt(vec3 N, vec3 L){
  if(uShadowOn<0.5) return 1.0;
  vec3 p=vSh.xyz/vSh.w*0.5+0.5; if(p.x<0.0||p.x>1.0||p.y<0.0||p.y>1.0||p.z>1.0) return 1.0;
  float bias=0.0012+0.0025*(1.0-abs(dot(N,L))); float s=0.0; vec2 ts=vec2(1.0/2048.0);
  for(int x=-2;x<=2;x++) for(int y=-2;y<=2;y++){ float d=texture(uShadow,p.xy+vec2(x,y)*ts*1.35).r; s+= (p.z-bias>d)?0.0:1.0; }

vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
void main(){

    float sh=shadowAt(vec3(0,1,0),uL1); float r=length(vPos.xz);
    float k=mix(1.0, 0.62+0.38*sh, smoothstep(2.2,0.0,r));

    frag=vec4(uBg*k,1.0); return;
  }
  vec3 base=uColor; if(uHasMap==1){ vec4 t=texture(uMap,vUv); base*=pow(t.rgb,vec3(2.2)); }
  float rough=uRough, refl=0.0, gloss=0.0;
  if(uHasP==1){ vec3 pm=texture(uPMap,vUv).rgb; rough=pm.r; refl=pm.g; gloss=pm.b; }
  mat3 TBN=cotFrame(N,vPos,vUv); vec3 n=vec3(0,0,1);
  if(uHasN==1){ vec3 t=texture(uNMap,vUv).xyz*2.0-1.0; t.xy*=uNStr; n=normalize(t); }

  float NV=max(dot(N,V),0.0);
  float shin=mix(260.0,6.0,rough); float specK=uSpec*(1.0-rough*0.65)+gloss*0.6;
  vec3 col=vec3(0.0);
  vec3 Ls[3]; Ls[0]=uL1; Ls[1]=uL2; Ls[2]=uL3; vec3 Cs[3]; Cs[0]=uC1; Cs[1]=uC2; Cs[2]=uC3;
  for(int i=0;i<3;i++){
    vec3 L=normalize(Ls[i]); float nl=dot(N,L);
    float dif=max((nl+uWrap)/(1.0+uWrap),0.0);
    float sh= i==0 ? shadowAt(N,L) : 1.0;
    vec3 H=normalize(L+V); float sp=pow(max(dot(N,H),0.0),shin)*(shin+8.0)/80.0*specK*step(0.0,nl);
    float fr=0.04+0.96*pow(1.0-max(dot(H,V),0.0),5.0);

  col+=uSheen*pow(1.0-NV,3.0)*mix(base,uSheenTint,0.5)*0.9;
  col+=vec3(pow(1.0-NV,5.0)*0.06*(1.0-rough))*amb*4.0;
  // 反光材料：逆反射，光源在相机处时最亮
  float retro=refl*pow(NV,1.5);
  col+= vec3(0.92,0.95,1.0)*retro*mix(0.08,5.0,uNight);
  col=aces(col*0.82);
  frag=vec4(pow(col,vec3(1.0/2.2)),uOpacity);
}`;

function createRenderer(canvas){
  const gl = canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true,alpha:false});
  if(!gl) return null;
  const compile=(src,type)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s};
  const program=(vs,fs)=>{const p=gl.createProgram();gl.attachShader(p,compile(vs,gl.VERTEX_SHADER));gl.attachShader(p,compile(fs,gl.FRAGMENT_SHADER));
    gl.bindAttribLocation(p,0,'aPos');gl.bindAttribLocation(p,1,'aNrm');gl.bindAttribLocation(p,2,'aUv');gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
    const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name)}return {p,u}};
  const main=program(VS,FS), shad=program(SVS,SFS);

  const SM=2048; const shTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,shTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,SM,SM,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
  [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.NEAREST));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const shFb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,shFb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shTex,0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE); gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const white=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,white); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([255,255,255,255]));
  const aniso=gl.getExtension('EXT_texture_filter_anisotropic');

  function mesh(g){
    const m={vao:gl.createVertexArray(),bufs:[gl.createBuffer(),gl.createBuffer(),gl.createBuffer(),gl.createBuffer()],count:0};
    m.update=g=>{gl.bindVertexArray(m.vao);
      [[g.pos,3],[g.nrm,3],[g.uv,2]].forEach(([d,s],i)=>{gl.bindBuffer(gl.ARRAY_BUFFER,m.bufs[i]);gl.bufferData(gl.ARRAY_BUFFER,d,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,s,gl.FLOAT,false,0,0)});
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.bufs[3]);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,g.idx,gl.DYNAMIC_DRAW);m.count=g.idx.length;gl.bindVertexArray(null);return m};

      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      const w=repeat?gl.REPEAT:gl.CLAMP_TO_EDGE;gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,repeat?gl.REPEAT:gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,w);
      if(aniso)gl.texParameterf(gl.TEXTURE_2D,aniso.TEXTURE_MAX_ANISOTROPY_EXT,8);return t};

    const bg=env.bg; gl.clearColor(bg[0],bg[1],bg[2],1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const P=main.p,u=main.u; gl.useProgram(P);
    gl.uniformMatrix4fv(u.uView,false,cam.view);gl.uniformMatrix4fv(u.uProj,false,cam.proj);gl.uniformMatrix4fv(u.uShadowVP,false,sVP);
    gl.uniform3fv(u.uCam,cam.pos);gl.uniform3fv(u.uBg,bg);
    [['uSky','sky'],['uGnd','gnd'],['uL1','L1'],['uL2','L2'],['uL3','L3'],['uC1','C1'],['uC2','C2'],['uC3','C3']].forEach(([k,e])=>gl.uniform3fv(u[k],env[e]));

      gl.uniform1f(u.uRough,m.rough??.7);gl.uniform1f(u.uSpec,m.spec??.2);gl.uniform1f(u.uSheen,m.sheen??0);gl.uniform1f(u.uNStr,m.nStr??1);
      gl.uniform1f(u.uDStr,m.dStr??.5);gl.uniform1f(u.uWrap,m.wrap??.25);gl.uniform2fv(u.uDRep,m.dRep||[1,1]);

// ---------- 几何工具 ----------
function surface(nu,nv,fn,{closeU=false}={}){
  const cols=nu+1,rows=nv+1,pos=new Float32Array(cols*rows*3),uv=new Float32Array(cols*rows*2);
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const u=i/nu,v=j/nv,p=fn(u,v),k=j*cols+i;pos.set(p,k*3);uv[k*2]=u;uv[k*2+1]=1-v}
  const idx=new Uint32Array(nu*nv*6);let o=0;
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*cols+i,b=a+1,c=a+cols,d=c+1;idx[o++]=a;idx[o++]=b;idx[o++]=c;idx[o++]=b;idx[o++]=d;idx[o++]=c}
  orient(pos,idx);
  const g={pos,uv,idx,cols,rows};g.nrm=normals(pos,idx);
  if(closeU){for(let j=0;j<rows;j++){const a=j*cols,b=j*cols+nu;for(let c=0;c<3;c++){const s=g.nrm[a*3+c]+g.nrm[b*3+c];g.nrm[a*3+c]=g.nrm[b*3+c]=s}}renorm(g.nrm)}
  return g;
}
function normals(pos,idx){const n=new Float32Array(pos.length);
  for(let i=0;i<idx.length;i+=3){const a=idx[i]*3,b=idx[i+1]*3,c=idx[i+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2],vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    for(const k of [a,b,c]){n[k]+=nx;n[k+1]+=ny;n[k+2]+=nz}}
  return renorm(n)}
// 自动定向：让三角形绕序朝外（相对网格质心）
function orient(pos,idx){let cx=0,cy=0,cz=0,n=pos.length/3;for(let i=0;i<pos.length;i+=3){cx+=pos[i];cy+=pos[i+1];cz+=pos[i+2]}cx/=n;cy/=n;cz/=n;let s=0;
  for(let i=0;i<idx.length;i+=3){const a=idx[i]*3,b=idx[i+1]*3,c=idx[i+2]*3;const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2],vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;s+=nx*(pos[a]-cx)+ny*(pos[a+1]-cy)+nz*(pos[a+2]-cz)}
  if(s<0)for(let i=0;i<idx.length;i+=3){const t=idx[i+1];idx[i+1]=idx[i+2];idx[i+2]=t}}
function renorm(n){for(let i=0;i<n.length;i+=3){const l=Math.hypot(n[i],n[i+1],n[i+2])||1;n[i]/=l;n[i+1]/=l;n[i+2]/=l}return n}
function merge(list){let nv=0,ni=0;list.forEach(g=>{nv+=g.pos.length/3;ni+=g.idx.length});
  const pos=new Float32Array(nv*3),nrm=new Float32Array(nv*3),uv=new Float32Array(nv*2),idx=new Uint32Array(ni);let ov=0,oi=0;
  for(const g of list){pos.set(g.pos,ov*3);nrm.set(g.nrm,ov*3);uv.set(g.uv,ov*2);for(let i=0;i<g.idx.length;i++)idx[oi+i]=g.idx[i]+ov;ov+=g.pos.length/3;oi+=g.idx.length}
  return {pos,nrm,uv,idx}}
function transformGeo(g,m){const pos=new Float32Array(g.pos.length),nrm=new Float32Array(g.nrm.length);
  for(let i=0;i<g.pos.length;i+=3){const x=g.pos[i],y=g.pos[i+1],z=g.pos[i+2];
    pos[i]=m[0]*x+m[4]*y+m[8]*z+m[12];pos[i+1]=m[1]*x+m[5]*y+m[9]*z+m[13];pos[i+2]=m[2]*x+m[6]*y+m[10]*z+m[14];
    const a=g.nrm[i],b=g.nrm[i+1],c=g.nrm[i+2];nrm[i]=m[0]*a+m[4]*b+m[8]*c;nrm[i+1]=m[1]*a+m[5]*b+m[9]*c;nrm[i+2]=m[2]*a+m[6]*b+m[10]*c}
  return {pos,nrm:renorm(nrm),uv:g.uv,idx:g.idx}}
function ellipsoid(c,r,nu=28,nv=18){return surface(nu,nv,(u,v)=>{const a=u*2*Math.PI,b=v*Math.PI;return [c[0]+r[0]*Math.sin(b)*Math.sin(a),c[1]+r[1]*Math.cos(b),c[2]+r[2]*Math.sin(b)*Math.cos(a)]},{closeU:true})}
function roundBox(w,h,d,r=.3){ // 圆角盒（超椭球）
  return surface(24,16,(u,v)=>{const a=u*2*Math.PI,b=v*Math.PI,e=r;const sp=(x,p)=>Math.sign(x)*Math.pow(Math.abs(x),p);
    return [w*sp(Math.sin(b),e)*sp(Math.sin(a),e),h*sp(Math.cos(b),e),d*sp(Math.sin(b),e)*sp(Math.cos(a),e)]},{closeU:true})}
// 沿路径的管状体：pts 点列，rad(t) 半径，可选 uv 周向起点 refUp
function tube(pts,rad,{nu=20,closeEnds=false,refUp=[0,1,0]}={}){
  const n=pts.length,frames=[];let T0=V3.norm(V3.sub(pts[1],pts[0]));let Nn=V3.norm(V3.cross(V3.cross(T0,refUp),T0));if(!isFinite(Nn[0])||V3.len(Nn)<.5)Nn=[1,0,0];
  for(let i=0;i<n;i++){const T=V3.norm(V3.sub(pts[Math.min(n-1,i+1)],pts[Math.max(0,i-1)]));Nn=V3.norm(V3.sub(Nn,V3.scale(T,V3.dot(Nn,T))));frames.push([T,Nn,V3.cross(T,Nn)])}
  return surface(nu,n-1,(u,v)=>{const fi=v*(n-1),i=Math.min(n-1,Math.round(fi));const [T,N,B]=frames[i];const a=u*2*Math.PI,r=rad(v,u);
    return V3.add(pts[i],V3.add(V3.scale(N,Math.cos(a)*r),V3.scale(B,Math.sin(a)*r)))},{closeU:true});
}

function bodyInfo(c){const m=c.meas,a=c.age,h=m.height/100,bmi=m.weight/(h*h);const [lo,md,hi]=BMI_REF[a];
  const z=bmi>=md?2*(bmi-md)/(hi-md):-2*(md-bmi)/(md-lo);
  const type=z<-1?['slim','偏瘦']:z<=1?['regular','标准']:z<=2?['sturdy','偏壮']:['round','圆润'];
  const grow=[0,3,6][c.growth||0];const hz=m.height+grow;const hao=SIZE_STEPS.find(x=>x>=hz-2)||140;
  const xing=Math.round((m.chest+(c.growth||0)*1)/4)*4;
  return {bmi,z,type:type[0],typeName:type[1],grow,fitTo:Math.round(m.height+grow+2),code:`${hao}/${xing}`,measured:`${m.height}/${m.chest}`}}
function estimateMeas(m,a){const h=m.height;const base=.25*h+28;const md=BMI_REF[a][1];const bmi=m.weight/Math.pow(h/100,2);

  const puller=(p,n,big,k='pull')=>{const down=[0,-1,0];const tx0=V3.norm(V3.cross(down,n));const sm=k==='ppull'?.7:1;
    place(roundBox(.0055*S*sm,.0085*S*sm,.0032*S*sm,.5),V3.add(p,V3.scale(n,.003)),n,tx0,'slider');
    const tl=(big?.021:.014)*S*sm,tw=(big?.0085:.0055)*S*sm;const q=V3.add(V3.add(p,V3.scale(n,.006+(big?.002:0))),[0,-tl*.9,0]);
    out.bits.push({k,g:transformGeo(roundBox(tw,tl,.0022*S,.45),M4.frame(q,tx0,[0,1,0],V3.norm(V3.add(n,[0,-.25,0]))))})};
  // 门襟拉头

  puller(zp,[open>.3?.3:0,0,1],cfg.bigPull,'pull');
  if(cfg.twoWayZip&&open<=.3){const qa=torsoP(0,.035),qb=torsoP(1,.035);puller(V3.add(V3.scale(V3.add(qa,qb),.5),[0,.022*S,0]),[0,0,1],false,'pull')}

  if(cfg.handPocket==='welt'){pocketPulls.push([.168,.45],[-.168,.45])}
  if(cfg.handPocket==='high'){pocketPulls.push([.145,.66],[-.145,.66])}
  if(cfg.chestPocket==='zipV')pocketPulls.push([.115,.87]);
  if(cfg.chestPocket==='zipH')pocketPulls.push([.175,.79]);
  for(const [f,v] of pocketPulls){const s=out.surfT(fu(f),v*vA);puller(s.p,s.n,false,'ppull')}

        if(deco==='bear'){place(ellipsoid([0,0,0],[hh*.11,hh*.11,hh*.045],20,14),V3.add(s.p,V3.scale(s.n,hh*.06)),fw,s.ta,'deco');
          place(ellipsoid([0,0,0],[hh*.065,hh*.065,hh*.012],18,10),V3.add(s.p,V3.add(V3.scale(s.n,hh*.07),V3.scale(fw,hh*.04))),fw,s.ta,'decoIn')}
        else if(deco==='bunny'){const n=V3.norm(V3.add(s.n,[sgn*.15,.5,-.15]));place(ellipsoid([0,0,0],[hh*.3,hh*.08,hh*.035],20,14),V3.add(s.p,V3.scale(n,hh*.25)),fw,n,'deco');
          place(ellipsoid([0,0,0],[hh*.21,hh*.045,hh*.01],18,10),V3.add(s.p,V3.add(V3.scale(n,hh*.25),V3.scale(fw,hh*.032))),fw,n,'decoIn')}

    }
  }

}

// ---- paint.js ----
// ===== paint.js — 在 UV 空间绘制拼色、缝线、口袋、拉链、反光、标志、内衬 =====
const REFL_HEX='#c8ccd1';
const curve=(fn,a,b,n=40)=>{const o=[];for(let i=0;i<=n;i++){const u=a+(b-a)*i/n;o.push([u,fn(u)])}return o};
const sfront=u=>u<.5?u:u-1; // 前中为 0，左侧缝 +0.25，右侧缝 -0.25

// —— 拼色模板：衣身区域 (u,v) 与袖子区域 (su,s) ——
function templateRegions(id,vA){
  const B=[],S=[],lines=[]; // lines: 需要缝线/滚边的分割线
  const above=(fn,c)=>{const pts=curve(fn,-.03,1.03,80);B.push({c,pts:[[-.03,1.1],...pts,[1.03,1.1]]});lines.push(pts)};
  const sAbove=(fn,c,side='both')=>{const pts=curve(fn,0,1,30).map(([u,s])=>[u,s]);S.push({c,side,pts:[[0,-.1],...pts,[1,-.1]]});lines.push({sleeve:side,pts})};
  const vv=f=>f*vA; // 以肩线以下的比例表示
  switch(id){
    case 'yoke': above(u=>vv(.86)+.025*Math.cos(2*Math.PI*u),'acc1'); sAbove(u=>.2+.025*Math.cos(2*Math.PI*u),'acc1'); break;
    case 'classic': above(()=>vv(.74),'acc1'); sAbove(()=>.5,'acc1'); break;
    case 'diagonal':{const f=u=>{u=((u%1)+1)%1;if(u<=.25)return vv(.74+1.05*u);if(u>=.75)return vv(.74+1.05*(u-1));return vv(.74+1.05*.25-1.05*(u-.25))};
      above(f,'acc1');const pts=curve(f,-.03,1.03,120);B.push({c:'acc2',pts:[...pts,...pts.map(([u,v])=>[u,v-.016]).reverse()]});
      S.push({c:'acc1',side:'R',pts:[[0,-.1],[1,-.1],[1,1.1],[0,1.1]]});break}
    case 'tri': B.push({c:'acc1',pts:[[-.03,1.1],[1.03,1.1],[1.03,vv(.84)],[-.03,vv(.84)]]});B.push({c:'acc2',pts:[[-.03,vv(.84)],[1.03,vv(.84)],[1.03,vv(.56)],[-.03,vv(.56)]]});
      lines.push([[-.03,vv(.84)],[1.03,vv(.84)]],[[-.03,vv(.56)],[1.03,vv(.56)]]);S.push({band:true});break;
    case 'side': for(const c0 of [.25,.75]){const w=.055;const pts=[[c0-w,-.05],[c0+w,-.05],[c0+w,vv(.9)],[c0,vv(1.0)],[c0-w,vv(.9)]];B.push({c:'acc1',pts});lines.push([[c0-w,-.05],[c0-w,vv(.9)],[c0,vv(1.0)],[c0+w,vv(.9)],[c0+w,-.05]])}
      S.push({c:'acc1',side:'both',pts:[[.37,0],[.63,0],[.63,1.1],[.37,1.1]]});lines.push({sleeve:'both',pts:[[.37,0],[.37,1]]},{sleeve:'both',pts:[[.63,0],[.63,1]]});break;
    case 'raglan': for(const m of [0,1]){const mk=u=>m?1-u:u;const pts=[[.075,1.1],[.075,1.0],[.215,vv(.98)],[.25,vv(.97)],[.285,vv(.98)],[.425,1.0],[.425,1.1]].map(([u,v])=>[mk(u),v]);B.push({c:'acc1',pts});lines.push(pts.slice(1,-1))}
      S.push({c:'acc1',side:'both',pts:[[0,-.1],[1,-.1],[1,1.1],[0,1.1]]});break;
    case 'chevron':{const top=u=>{const f=sfront(((u%1)+1)%1);return Math.abs(f)<=.25?vv(.9-.85*Math.abs(f)):vv(.9-.85*.25)};const bot=u=>top(u)-vv(.12);
      const t=curve(top,-.03,1.03,120),b=curve(bot,-.03,1.03,120);B.push({c:'acc1',pts:[...t,...b.reverse()]});
      const t2=curve(u=>top(u)+.014,-.03,1.03,120);B.push({c:'acc2',pts:[...t2,...curve(top,-.03,1.03,120).reverse()]});lines.push(t2,curve(bot,-.03,1.03,120));break}
  }

}
const TEMPLATE_COLLAR={solid:'main',yoke:'acc1',classic:'acc1',diagonal:'acc1',tri:'acc1',side:'main',raglan:'acc1',chevron:'main',pop:'main'};
function pointIn(pts,x,y){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const [xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function regionColorAt(regs,u,v,fallback='main'){let c=fallback;for(const r of regs){if(r.pts&&pointIn(r.pts,u,v))c=r.c}return c}

// —— 画布工具 ——
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true});return c}
function Part(w,h,{wrap=false,rough=.6,lining=false}={}){
  const P={w,h,wrap,c:mkCanvas(w,h),hg:mkCanvas(w,h),pr:mkCanvas(w,h)};
  P.x=P.c.getContext('2d');P.y=P.hg.getContext('2d',{willReadFrequently:true});P.z=P.pr.getContext('2d');
  P.y.fillStyle='#808080';P.y.fillRect(0,0,w,h);P.z.fillStyle=`rgb(${rough*255|0},0,0)`;P.z.fillRect(0,0,w,h);P.base=rough;
  P.X=u=>u*w; P.Y=v=>(1-v)*h;
  P.path=pts=>{const p=new Path2D();const offs=wrap?[-w,0,w]:[0];for(const o of offs){pts.forEach(([u,v],i)=>{const x=u*w+o,y=(1-v)*h;i?p.lineTo(x,y):p.moveTo(x,y)});p.closePath()}return p};
  P.open=pts=>{const p=new Path2D();const offs=wrap?[-w,0,w]:[0];for(const o of offs){pts.forEach(([u,v],i)=>{const x=u*w+o,y=(1-v)*h;i?p.lineTo(x,y):p.moveTo(x,y)})}return p};
  const pcol=(r,refl,g)=>`rgb(${Math.round(r*255)},${Math.round(refl*255)},${Math.round(g*255)})`;
  P.fill=(pts,col,o={})=>{const p=P.path(pts);if(col){P.x.fillStyle=col;P.x.fill(p)}if(o.h!=null){P.y.fillStyle=gray(o.h);P.y.fill(p)}
    if(o.rough!=null||o.refl||o.gloss){P.z.fillStyle=pcol(o.rough??P.base,o.refl||0,o.gloss||0);P.z.fill(p)}};
  P.line=(pts,width,col,o={})=>{const p=P.open(pts);const set=(ctx,st)=>{ctx.lineWidth=width;ctx.lineCap=o.cap||'butt';ctx.lineJoin='round';ctx.setLineDash(o.dash||[]);ctx.strokeStyle=st;ctx.stroke(p);ctx.setLineDash([])};
    if(col){P.x.globalAlpha=o.alpha??1;set(P.x,col);P.x.globalAlpha=1}if(o.h!=null)set(P.y,gray(o.h));if(o.rough!=null||o.refl||o.gloss)set(P.z,pcol(o.rough??P.base,o.refl||0,o.gloss||0))};

  P.seam=(pts,o={})=>{P.line(pts,o.w||3,null,{h:.28});P.line(pts,1.4,'rgba(0,0,0,.28)',{});
    if(o.top!==false){const off=o.off||5;for(const s of [-1,1]){if(o.one&&s<0)continue;P.line(offsetLine(pts,s*off,P),1.1,'rgba(0,0,0,.30)',{dash:[4,3],h:.58})}}};
  P.img=(src,cx,cy,wpx,hpx,tf=[1,1],o={})=>{const draw=(ctx,im)=>{const offs=wrap?[-w,0,w]:[0];for(const of of offs){ctx.save();ctx.translate(cx+of,cy);ctx.scale(tf[0],tf[1]);ctx.drawImage(im,-wpx/2,-hpx/2,wpx,hpx);ctx.restore()}};
    if(o.color!==false)draw(P.x,src);if(o.hsrc)draw(P.y,o.hsrc);if(o.psrc)draw(P.z,o.psrc)};
  return P;
}
const gray=v=>{const g=Math.round(Math.max(0,Math.min(1,v))*255);return `rgb(${g},${g},${g})`};
function offsetLine(pts,d,P){ // 像素空间偏移
  const px=pts.map(([u,v])=>[u*P.w,(1-v)*P.h]);return px.map((p,i)=>{const a=px[Math.max(0,i-1)],b=px[Math.min(px.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;return [(p[0]+(-dy/l)*d)/P.w,1-(p[1]+(dx/l)*d)/P.h]})}
function tint(src,color){const c=mkCanvas(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c}
const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16);const f=c=>Math.max(0,Math.min(255,Math.round(c*k)));return '#'+[n>>16&255,n>>8&255,n&255].map(f).map(v=>v.toString(16).padStart(2,'0')).join('')};
const lum=hex=>{const n=parseInt(hex.slice(1),16);return (.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255};

// —— 标志画布 ——
const logoCache=new Map();
function logoCanvas(L,px=420){
  const key=JSON.stringify([L.kind,L.icon,L.text,L.font,L.shape,L.fg,L.bg,L.method,L.img?L.img.length+L.img.slice(-40):0,px]);
  if(logoCache.has(key))return logoCache.get(key);
  const fg=L.method==='reflective'?REFL_HEX:L.fg;
  const font=FONTS[L.font]||FONTS.round;const text=(L.text||'').slice(0,16);
  const ic=ICONS[L.icon]&&ICONS[L.icon].d?ICONS[L.icon]:null;
  const img=L.kind==='image'&&L.img?L._im:null;
  const badge=L.shape!=='none';
  let W,Hh;const c0=mkCanvas(10,10).getContext('2d');
  const tsize=px*.26;c0.font=`${font[2]} ${tsize}px ${font[1]}`;const tw=text?c0.measureText(text).width:0;
  if(L.shape==='pill'){W=Math.max(px*1.0,(ic||img?px*.42:0)+tw+px*.34);Hh=px*.46}
  else if(badge){W=Hh=px}
  else{W=Math.max(1,(ic||img?px*.62:0)+(text?(ic||img?px*.08:0)+tw:0));Hh=px*.62;if(!text&&(ic||img))W=Hh=px*.62*(img?img.width/img.height:1)}
  const c=mkCanvas(Math.ceil(W)+8,Math.ceil(Hh)+8),x=c.getContext('2d');x.translate(4,4);
  const icon=(cx,cy,s,col)=>{if(img){const r=img.width/img.height;let iw=s,ih=s;if(r>1)ih=s/r;else iw=s*r;x.drawImage(img,cx-iw/2,cy-ih/2,iw,ih);return}
    x.save();x.translate(cx-s/2,cy-s/2);x.scale(s/100,s/100);x.fillStyle=col;x.fill(new Path2D(ic.d),'evenodd');if(ic.d2){x.fillStyle=L.shape==='none'||!badge?shade(col,lum(col)>.5?.8:1.6):L.bg;x.fill(new Path2D(ic.d2))}
    if(ic.hole){x.globalCompositeOperation='destination-out';x.fill(new Path2D(ic.hole));x.globalCompositeOperation='source-over'}x.restore()};
  x.textBaseline='middle';x.textAlign='center';
  if(L.shape==='pill'){x.fillStyle=L.bg;rr(x,0,0,W,Hh,Hh/2);x.fill();let tx=W/2;if(ic||img){icon(Hh*.62,Hh/2,Hh*.62,fg);tx=Hh*.62+Hh*.42+tw/2}x.fillStyle=fg;x.font=`${font[2]} ${tsize}px ${font[1]}`;x.fillText(text,tx,Hh/2+tsize*.04)}
  else if(badge){x.fillStyle=L.bg;shapePath(x,L.shape,W,Hh);x.fill();x.lineWidth=px*.03;x.strokeStyle=fg;x.globalAlpha=.9;
    x.save();x.translate(W/2,Hh/2);x.scale(.88,.88);x.translate(-W/2,-Hh/2);shapePath(x,L.shape,W,Hh);x.stroke();x.restore();x.globalAlpha=1;
    const has=ic||img;if(has)icon(W/2,text?Hh*.42:Hh/2,text?px*.42:px*.56,fg);
    if(text){let ts=Math.min(px*.2,px*.66/Math.max(1,c0.measureText(text).width/tsize));x.font=`${font[2]} ${ts}px ${font[1]}`;x.fillStyle=fg;x.fillText(text,W/2,has?Hh*.74:Hh/2)}}
  else{let ox=0;if(ic||img){const s=Hh;icon(img&&!text?W/2:s/2,Hh/2,img&&!text?Math.max(W,Hh):s,fg);ox=s+px*.08}
    if(text){x.font=`${font[2]} ${tsize}px ${font[1]}`;x.fillStyle=fg;x.textAlign='left';x.fillText(text,ox,Hh/2+tsize*.05)}}
  if(logoCache.size>40)logoCache.clear();logoCache.set(key,c);return c;
}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function shapePath(x,s,W,H){x.beginPath();
  if(s==='circle'){x.arc(W/2,H/2,W/2,0,7)}else if(s==='round'){rr(x,0,0,W,H,W*.2);return}

  else if(s==='hex'){for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;x.lineTo(W/2+Math.cos(a)*W/2,H/2+Math.sin(a)*H/2)}x.closePath()}}

// —— 口袋几何（衣身比例坐标：f 前中偏移，k = v/vA） ——
function pocketDefs(cfg){
  const P=[];
  const zip=(a,b,side='both')=>P.push({kind:'zip',a,b,side});
  if(cfg.handPocket==='welt')zip([.10,.20],[.168,.45]);
  if(cfg.handPocket==='high')zip([.13,.44],[.145,.66]);
  if(cfg.handPocket==='flap')P.push({kind:'flap',f0:.06,f1:.2,k0:.1,k1:.36,side:'both'});
  if(cfg.handPocket==='kangaroo')P.push({kind:'kangaroo',k0:.08,k1:.42});
  if(cfg.chestPocket==='zipV')zip([.115,.62],[.115,.87],'L');
  if(cfg.chestPocket==='zipH')zip([.065,.79],[.175,.79],'L');
  if(cfg.chestPocket==='patch')P.push({kind:'flap',f0:.07,f1:.17,k0:.6,k1:.78,side:'L',small:true});

}

// —— 总绘制 ——
function paintAll(cfg,g){
  const T=TYPES[cfg.type],C={...cfg.colors};
  const vA=g.vA,tmpl=templateRegions(cfg.template,vA);

  const sleeveColorAt=(side,su,s)=>{let c='main';for(const r of tmpl.S){if(r.band)continue;if(r.side!=='both'&&r.side!==side)continue;if(pointIn(r.pts,su,s))c=r.c}return c};
  C.hood=col(cfg.hoodColor);C.collar=cfg.collar==='hood'?C.hood:col(regionColorAt(tmpl.B,.08,.995,TEMPLATE_COLLAR[cfg.template]));
  if(cfg.collar==='hood')C.collar=col(regionColorAt(tmpl.B,.08,.995,'main'));
  C.hem=col(regionColorAt(tmpl.B,.1,.005));C.tape=cfg.zipType==='waterproof'?col(regionColorAt(tmpl.B,.01,.5)):C.zip;
  C.pull=col(cfg.pullColor==='zip'?'zip':cfg.pullColor);C.hoodRim=C.hood;
  C.cuffL=cfg.cuff==='velcro'?col(sleeveColorAt('L',.5,.99)):C.trim;C.cuffR=cfg.cuff==='velcro'?col(sleeveColorAt('R',.5,.99)):C.trim;
  const out={colors:C};
  const pxU=2048/g.torsoM.u,pxV=1024/g.torsoM.v; // 像素 / 米
  // ================= 衣身 =================
  const P=Part(2048,1024,{wrap:true,rough:T.rough});
  P.x.fillStyle=C.main;P.x.fillRect(0,0,2048,1024);
  tmpl.B.forEach(r=>P.fill(r.pts,col(r.c)));
  if(cfg.template==='pop'){} // 点缀色体现在部件
  // 分割线缝线
  tmpl.lines.forEach(l=>{if(Array.isArray(l))P.seam(l)});
  // 侧缝/肩缝
  if(cfg.template!=='side')for(const u of [.25,.75])P.seam([[u,-.02],[u,1.02]],{top:false});
  // 羽绒绗缝
  if(cfg.type==='down')for(let k=1;k<6;k++){const v=k/6*vA;P.seam([[-.02,v],[1.02,v]],{top:false,w:4})}
  // 下摆
  P.line([[-.02,.012],[1.02,.012]],1.2,'rgba(0,0,0,.3)',{dash:[4,3],h:.6});P.line([[-.02,.004],[1.02,.004]],5,null,{h:.62});
  // 拉链
  const zw=.0075/g.torsoM.u, teeth=cfg.zipType==='standard';
  for(const side of [0,1]){const u0=side?1-zw:0,u1=side?1:zw;

    if(teeth){const tz=side?1-zw*.45:zw*.45;const rows=Math.round(g.torsoM.v/.0032);for(let i=0;i<rows;i++){if((i+side)%2)continue;const v=i/rows;const hgt=1/rows*.9;

  // 口袋
  const pc=col(cfg.pocketColor), fu=f=>f<0?1+f:f;

      const body=[[fu(a),k0],[fu(b),k0],[fu(b),k1],[fu(a),k1]];P.fill(body,pc,{h:.6});P.seam(body.concat([body[0]]),{one:false,off:4});

  // 标志

    if(L.method==='embroidery'){Pt.x.save();const hatch=mkCanvas(lc.width,lc.height),hx=hatch.getContext('2d');hx.drawImage(lc,0,0);hx.globalCompositeOperation='source-in';
      const pat=mkCanvas(6,6),px=pat.getContext('2d');px.strokeStyle='rgba(255,255,255,.22)';px.lineWidth=1.2;px.beginPath();px.moveTo(0,6);px.lineTo(6,0);px.stroke();hx.fillStyle=hx.createPattern(pat,'repeat');hx.fillRect(0,0,lc.width,lc.height);
      Pt.img(hatch,cx,cy,w,h,tf,{});Pt.x.restore()}};
  for(const L of logos){if(!L.place||!L.place.startsWith||['sleeveL','sleeveR'].includes(L.place))continue;
    const cy=cfg.chestPocket==='zipH'?.69:.79,cu=cfg.chestPocket==='zipV'?.16:.135;const pos={chestL:[cu,cy*vA],chestR:[1-cu,cy*vA],back:[.5,.7*vA],backLow:[.5,.32*vA],backNeck:[.5,vA+.02],hemR:[.9,.14*vA]}[L.place];if(!pos)continue;
    const wpx=L.size/100*pxU;drawLogo(P,L,P.X(pos[0]),P.Y(pos[1]),wpx,pxV/pxU,[1,1]);}
  out.torso={map:P.c,hgt:P.hg,pmap:P.pr};
  // 衣身内衬
  out.torso.lmap=liningCanvas(cfg,2048,1024,{facing:zw*3.4,mainAt:(u,v)=>col(regionColorAt(tmpl.B,u,v)),label:{u:.5,v:vA-.05,pxU,pxV},type:'torso'});
  // ================= 袖子 =================
  if(g.sleeves){for(const side of ['L','R']){const SP=Part(512,1024,{wrap:true,rough:T.rough});const cap=g.sleeves[side].capFrac;
      const sToT=s=>cap+s*(1-cap); // 区域 s 以全长计
      const sx=su=>su, sy=s=>1-s; // 袖子画布：v=1-s
      SP.x.fillStyle=C.main;SP.x.fillRect(0,0,512,1024);
      const conv=pts=>pts;
      for(const r of tmpl.S){

          const ys=s=>g.sleeves[side].surf(.25,Math.max(0,(s-cap)/(1-cap))).p[1];const vOf=y=>{let best=0,bd=1e9;for(let i=0;i<=60;i++){const v=i/60*vA;const yy=g.torsoP(.25,v)[1];if(Math.abs(yy-y)<bd){bd=Math.abs(yy-y);best=v}}return best};
          let prev=null,start=0;for(let i=0;i<=40;i++){const s=i/40;const c=i<40?regionColorAt(tmpl.B,.25,vOf(ys(s))):null;if(c!==prev){if(prev&&prev!=='main'){SP.fill(conv([[-.02,start],[1.02,start],[1.02,s],[-.02,s]]),col(prev))}if(prev&&i<40&&i>0)SP.seam(conv([[-.02,s],[1.02,s]]));prev=c;start=s}}

        if(r.side!=='both'&&r.side!==side)continue;SP.fill(conv(r.pts),col(r.c))}
      tmpl.lines.forEach(l=>{if(l.sleeve&&(l.sleeve==='both'||l.sleeve===side)){SP.seam(conv(l.pts));if(cfg.refl.piping)SP.line(conv(l.pts),5,REFL_HEX,{h:.62,refl:1,rough:.35})}});
      SP.seam(conv([[-.02,cap+.01],[1.02,cap+.01]]),{top:true});
      SP.seam(conv([[.5,cap],[.5,1]]),{top:false});
      if(cfg.type==='down')for(let k=1;k<7;k++){const s=cap+(1-cap)*k/7;SP.seam(conv([[-.02,s],[1.02,s]]),{top:false,w:4})}
      // 袖口

      else{SP.fill(conv([[-.02,.93],[1.02,.93],[1.02,1.02],[-.02,1.02]]),C.trim,{h:.6});
        if(cfg.cuff==='rib')for(let i=0;i<64;i++){const u=i/64;SP.line(conv([[u,.93],[u,1]]),3,'rgba(0,0,0,.18)',{h:.4})}
        else for(let i=0;i<40;i++){const u=i/40;SP.line(conv([[u,.935],[u+.008,1]]),2,'rgba(0,0,0,.12)',{h:.42})}
        SP.seam(conv([[-.02,.93],[1.02,.93]]))}
      if(cfg.growCuff)SP.line([[-.02,.9],[1.02,.9]],1.4,'rgba(0,0,0,.35)',{dash:[3,3],h:.4});
      if(cfg.refl.band){const b=[[-.02,.8],[1.02,.8],[1.02,.835],[-.02,.835]];SP.fill(conv(b),REFL_HEX,{h:.6,refl:1,rough:.35})}
      if(side==='L'&&cfg.sleevePocket){const s0=sToT(.26),s1=sToT(.45);const pts=conv([[.06,s0],[.06,s1]]);const wpx=6;SP.line(pts,wpx+8,null,{h:.38});SP.line(pts,wpx,C.zip,{h:.62,gloss:.4});SP.seam(offsetLine(pts,9,SP),{top:false,w:1.5});SP.seam(offsetLine(pts,-9,SP),{top:false,w:1.5})}
      for(const L of logos){if(L.place!=='sleeve'+side)continue;const pxu=512/g.sleeveM.u,pxv=1024/g.sleeveM.v;drawLogo(SP,L,SP.X(.0),SP.Y(sToT(.3)),L.size/100*pxu,pxv/pxu,side==='L'?[-1,-1]:[1,-1])}
      out['sleeve'+side]={map:SP.c,hgt:SP.hg,pmap:SP.pr,lmap:liningCanvas(cfg,256,512,{type:'sleeve'})};
    }}

  const zwc=.0075/g.collarM.u;for(const side of [0,1]){const u0=side?1-zwc:0,u1=side?1:zwc;CP.fill([[u0,-.1],[u1,-.1],[u1,1.1],[u0,1.1]],C.tape,{h:.55})}

// —— 内衬贴图 ——
function liningCanvas(cfg,w,h,o={}){
  const c=mkCanvas(w,h),x=c.getContext('2d');const L=cfg.colors.lining;x.fillStyle=L;x.fillRect(0,0,w,h);
  const t=cfg.lining;const r=mulberry(7);
  if(t==='quilted'){x.strokeStyle='rgba(0,0,0,.16)';x.lineWidth=2;const s=w/14;for(let i=-h;i<w+h;i+=s){x.beginPath();x.moveTo(i,0);x.lineTo(i+h,h);x.stroke();x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke()}}
  if(t==='taffeta'){const gr=x.createLinearGradient(0,0,w,0);gr.addColorStop(0,'rgba(255,255,255,.06)');gr.addColorStop(.5,'rgba(0,0,0,.04)');gr.addColorStop(1,'rgba(255,255,255,.06)');x.fillStyle=gr;x.fillRect(0,0,w,h)}
  if(t==='print'){const ic=['star','paw','dino','heart','mountain'];const cols=[cfg.colors.acc1,cfg.colors.acc2,cfg.colors.main];const s=Math.max(22,w/26);
    for(let j=0;j<h/s+1;j++)for(let i=0;i<w/s+1;i++){if(r()<.35)continue;const k=ic[(i*3+j*7)%ic.length];x.save();x.translate(i*s+(j%2)*s/2,j*s);x.rotate((r()-.5)*.8);x.scale(s/180,s/180);x.translate(-50,-50);x.fillStyle=cols[(i+j)%3];x.globalAlpha=.8;x.fill(new Path2D(ICONS[k].d));x.restore()}}
  if(t==='mesh'){x.fillStyle='rgba(0,0,0,.08)';for(let j=0;j<h;j+=6)for(let i=0;i<w;i+=6){x.beginPath();x.arc(i+(j/6%2)*3,j,1.3,0,7);x.fill()}}
  if(t==='fleece'){const id=x.getImageData(0,0,w,h);for(let i=0;i<id.data.length;i+=4){const n=(r()-.5)*18;id.data[i]+=n;id.data[i+1]+=n;id.data[i+2]+=n}x.putImageData(id,0,0)}
  if(o.type==='torso'&&o.facing){const fw=o.facing*w;// 门襟贴边（面料色）
    for(const [x0,x1] of [[0,fw],[w-fw,w]]){for(let j=0;j<32;j++){const v0=j/32;x.fillStyle=o.mainAt(x0<1?.01:.99,1-v0-1/64);x.fillRect(x0,v0*h,x1-x0,h/32+1)}
      x.strokeStyle='rgba(0,0,0,.3)';x.setLineDash([4,3]);x.beginPath();const xx=x0<1?x1-4:x0+4;x.moveTo(xx,0);x.lineTo(xx,h);x.stroke();x.setLineDash([])}
    // 内侧下摆贴边
    x.fillStyle=o.mainAt(.5,.01);x.fillRect(0,h-h*.03,w,h*.03);
    // 姓名标
    if(cfg.nameLabel){const lw=.05*o.pxU,lh=.024*o.pxV;const cx=o.label.u*w,cy=(1-o.label.v)*h;x.save();x.translate(cx,cy);x.scale(-1,1);x.fillStyle='#fbfaf6';x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=3;x.fillRect(-lw/2,-lh/2,lw,lh);x.shadowBlur=0;
      x.fillStyle='#2b3440';x.font=`700 ${lh*.42}px "ZCOOL KuaiLe","Noto Sans SC",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(cfg.nameLabel.slice(0,8),0,-lh*.08);x.font=`${lh*.18}px "IBM Plex Mono",monospace`;x.fillStyle='#7a8592';x.fillText('LITTLE WEAR · '+cfg.meas.height+'cm',0,lh*.3);x.restore()}}
  if(o.type==='hood'){x.fillStyle=cfg.colors.lining;}
  return c;
}

// ===== flat.js — 平面款式图（SVG），复用拼色模板与口袋定义 =====
function flatSVG(cfg,side='front',o={}){
  const vA=.8, F=side==='front', vest=cfg.type==='vest';
  const C={...cfg.colors};const col=k=>C[k]||C.main;
  const tm=templateRegions(cfg.template,vA);
  const hemY=F?390:(cfg.hem==='droptail'?404:390), shY=152, neckY=122, cx=200, hw=96;
  const Y=v=>v<=vA?hemY-(v/vA)*(hemY-shY):shY-((v-vA)/(1-vA))*(shY-neckY+6);
  const X=u=>{if(F){const f=sfront(((u%1)+1)%1);return cx+f*4*hw}return cx+(u-.5)*4*hw};
  const id='f'+Math.random().toString(36).slice(2,8);
  const stroke=o.mini?1.4:1.6, ink='#2a3336';
  const body=`M${cx-34} ${neckY} L${cx-104} ${shY} L${cx-96} 210 L${cx-98} ${hemY} L${cx+98} ${hemY} L${cx+96} 210 L${cx+104} ${shY} L${cx+34} ${neckY} Q${cx} ${neckY+(F?16:6)} ${cx-34} ${neckY} Z`;
  // 袖子四边形
  const sl=(s)=>{const TO=[cx+s*104,shY],TI=[cx+s*94,212],BO=[cx+s*168,374],BI=[cx+s*137,384];return {TO,TI,BO,BI}};
  const sp=(Q,t,s)=>{const a=[Q.TO[0]+(Q.TI[0]-Q.TO[0])*t,Q.TO[1]+(Q.TI[1]-Q.TO[1])*t],b=[Q.BO[0]+(Q.BI[0]-Q.BO[0])*t,Q.BO[1]+(Q.BI[1]-Q.BO[1])*t];return [a[0]+(b[0]-a[0])*s,a[1]+(b[1]-a[1])*s]};
  const P=pts=>pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L');
  let defs='',out='';
  // 帽子 / 领
  const hoodC=col(cfg.hoodColor);
  const collarC=cfg.collar==='hood'?col(regionColorAt(tm.B,.08,.995,'main')):col(regionColorAt(tm.B,.08,.995,TEMPLATE_COLLAR[cfg.template]));
  if(cfg.collar==='hood'){
    if(F){out+=`<path d="M${cx-38} ${neckY+4} C${cx-50} 30 ${cx+50} 30 ${cx+38} ${neckY+4} Z" fill="${hoodC}" stroke="${ink}" stroke-width="${stroke}"/>`;
      out+=`<path d="M${cx-26} ${neckY} C${cx-30} 62 ${cx+30} 62 ${cx+26} ${neckY} Z" fill="${C.lining}" stroke="${ink}" stroke-width="${stroke*.8}"/>`;
      if(cfg.hoodBrim)out+=`<path d="M${cx-30} 74 C${cx-14} 54 ${cx+14} 54 ${cx+30} 74" fill="none" stroke="${ink}" stroke-width="${stroke*.7}" stroke-dasharray="3 2"/>`;}
    else{out+=`<path d="M${cx-40} ${neckY+8} C${cx-54} 26 ${cx+54} 26 ${cx+40} ${neckY+8} Q${cx} ${neckY+20} ${cx-40} ${neckY+8} Z" fill="${hoodC}" stroke="${ink}" stroke-width="${stroke}"/><path d="M${cx-12} 40 L${cx-14} ${neckY+12} M${cx+12} 40 L${cx+14} ${neckY+12}" stroke="${ink}" stroke-width="${stroke*.7}" stroke-dasharray="3 2"/>`}
    const dc=cfg.hoodDeco;
    if(dc==='bear')for(const s of [-1,1])out+=`<circle cx="${cx+s*36}" cy="46" r="13" fill="${hoodC}" stroke="${ink}" stroke-width="${stroke}"/><circle cx="${cx+s*36}" cy="46" r="7" fill="${C.acc2}"/>`;
    if(dc==='bunny')for(const s of [-1,1])out+=`<ellipse cx="${cx+s*22}" cy="8" rx="9" ry="30" fill="${hoodC}" stroke="${ink}" stroke-width="${stroke}"/><ellipse cx="${cx+s*22}" cy="10" rx="4" ry="21" fill="${C.acc2}"/>`;
    if(dc==='cat')for(const s of [-1,1])out+=`<path d="M${cx+s*20} 40 L${cx+s*38} 18 L${cx+s*44} 50 Z" fill="${hoodC}" stroke="${ink}" stroke-width="${stroke}"/>`;
    if(dc==='dino'){for(let i=0;i<4;i++){const x=cx-27+i*18;out+=`<path d="M${x-7} ${40-i%2} L${x} ${22-i%2*2} L${x+7} ${40-i%2} Z" fill="${C.acc2}" stroke="${ink}" stroke-width="${stroke*.8}"/>`}}
  }
  // 衣身
  defs+=`<clipPath id="${id}b"><path d="${body}"/></clipPath>`;
  let bodyG=`<rect x="0" y="0" width="400" height="480" fill="${C.main}"/>`;
  tm.B.forEach(r=>{const pts=r.pts.map(([u,v])=>[u,v]);
    if(F){ // 前片：u 0..0.25 与 0.75..1 两段，按 f 坐标展开
      for(const off of [0,-1]){const pp=pts.map(([u,v])=>[cx+(u+off)*4*hw,Y(v)]);bodyG+=`<path d="M${P(pp)}Z" fill="${col(r.c)}"/>`}}

// ===== viewer.js — 场景组装、相机、交互 =====
function createViewer(canvas){
  const R=createRenderer(canvas); if(!R) return null;
  const V={R,yaw:-.45,pitch:.08,dist:2.2,target:[0,.6,0],fov:.5,items:[],meshes:{},tex:{},open:0,openTarget:0,night:0,auto:false,showBody:true,dirty:true,bg:[.93,.94,.92],onFrame:null};
  const texOf=(key,canvas,repeat=false)=>{if(!canvas)return null;if(V.tex[key]){V.tex[key].update(canvas);return V.tex[key]}return V.tex[key]=R.texture(canvas,{repeat})};
  const meshOf=(key,g)=>{if(V.meshes[key]){V.meshes[key].update(g);return V.meshes[key]}return V.meshes[key]=R.mesh(g)};
  V.detailTex={};

    V.cfg=cfg;const d=dims(cfg);V.d=d;
    const T=TYPES[cfg.type];
    const g=buildGarment(cfg,d,{open:V.open,hoodUp:V.hoodUp});V.g=g;
    const items=[];const used=new Set();
    const add=(key,geo,mat,extra={})=>{used.add(key);items.push({mesh:meshOf(key,geo),mat,...extra})};
    // 人台
    if(!V.bodyKey||V.bodyKey!==JSON.stringify([cfg.age,cfg.meas])){V.bodyParts=buildBody(d);V.bodyKey=JSON.stringify([cfg.age,cfg.meas]);V.bodyGeo=null}
    const bodyMats={skin:{color:hex2lin('#dcd2c6'),rough:.78,spec:.06,wrap:.35},tee:{color:hex2lin('#f1efe8'),rough:.9,spec:.03,wrap:.4,detail:V.detail('knit'),dRep:[60,60],dStr:.3},
      pants:{color:hex2lin(cfg.colors.pants),rough:.85,spec:.05,wrap:.3,detail:V.detail('twill'),dRep:[40,40],dStr:.5},shoe:{color:hex2lin('#f2f1ec'),rough:.6,spec:.15},sole:{color:hex2lin('#3d4249'),rough:.7,spec:.1}};
    V.bodyParts.forEach((p,i)=>{if(!V.showBody&&p.k!=='tee'&&p.k!=='skin')return;if(!V.showBody)return;add('body'+i,p.g,bodyMats[p.k])});
    // 衣服材质
    const fab=(p,base)=>({map:texOf(p+'.map',paint[p]?.map),nmap:texOf(p+'.n',paint[p]?.nmap),pmap:texOf(p+'.p',paint[p]?.pmap),
      rough:T.rough,spec:T.spec,sheen:T.sheen,sheenTint:[1,1,1],wrap:cfg.type==='fleece'?.45:.28,detail:V.detail(T.detail),dStr:cfg.type==='fleece'?.9:.55,nStr:1.2,...base});
    const lin=(p,dr)=>{const L=LINING_LOOK[cfg.lining];return {map:texOf(p+'.lmap',paint[p]?.lmap),nmap:texOf(p+'.ln',paint[p]?.lnmap),side:'back',rough:L.rough,spec:L.spec,sheen:L.sheen,wrap:.35,detail:V.detail(L.detail),dRep:dr,dStr:L.dStr}};
    const tm=g.torsoM, rep=(mu,mv,k=1)=>[mu*k*40,mv*k*40];
    add('torso',g.torso,fab('torso',{dRep:rep(tm.u,tm.v)}));
    add('torsoIn',g.torso,lin('torso',rep(tm.u,tm.v)));
    add('collar',g.collar,fab('collar',{dRep:rep(g.collarM.u,g.collarM.v)}));
    add('collarIn',g.collar,lin('collar',rep(g.collarM.u,g.collarM.v)));
    if(g.hood){add('hood',g.hood,fab('hood',{dRep:rep(g.hoodM.u,g.hoodM.v)}));add('hoodIn',g.hood,lin('hood',rep(g.hoodM.u,g.hoodM.v)));}
    if(g.sleeves){for(const k of ['L','R']){add('sleeve'+k,g.sleeves[k],fab('sleeve'+k,{dRep:rep(g.sleeveM.u,g.sleeveM.v)}));add('sleeveIn'+k,g.sleeves[k],lin('sleeve'+k,rep(g.sleeveM.u,g.sleeveM.v)))}}
    const col=k=>hex2lin(paint.colors[k]);
    const solid=(hex,o={})=>({color:hex,rough:T.rough,spec:T.spec,sheen:T.sheen,wrap:.3,detail:V.detail(T.detail),dRep:[30,30],dStr:.4,...o});
    add('hemRim',g.hemRim,solid(col('hem')));
    add('collarRim',g.collarRim,solid(col('collar')));
    g.frontEdges.forEach((e,i)=>add('edge'+i,e,solid(col('tape'),{rough:.5})));
    if(g.hoodRim)add('hoodRim',g.hoodRim,solid(col(cfg.hoodBrim?'hood':'hoodRim')));
    if(g.cuffRims)g.cuffRims.forEach((e,i)=>add('cuffRim'+i,e,solid(col('cuff'+(i?'R':'L')))));
    if(g.armholes)g.armholes.forEach((e,i)=>add('armhole'+i,e,solid(col('trim'))));
    const bitMat={slider:{color:hex2lin(cfg.zipType==='waterproof'?'#2b2f33':'#6b7077'),rough:.3,spec:.9},pull:{color:col('pull'),rough:.55,spec:.3},ppull:{color:col('zip'),rough:.55,spec:.25},
      deco:solid(col('hood')),decoIn:solid(col('acc2'),{rough:.8})};
    if(cfg.hoodDeco==='dino'){bitMat.deco=solid(col('acc2'))}
    g.bits.forEach((b,i)=>add('bit'+i+b.k,b.g,bitMat[b.k]||bitMat.pull));
    // 地面
    if(!V.meshes.ground)V.meshes.ground=R.mesh(surface(48,4,(u,v)=>[Math.sin(u*6.283)*v*4,0,Math.cos(u*6.283)*v*4]));
    items.push({mesh:V.meshes.ground,mat:{ground:true}});
    // 清理不用的网格
    for(const k of Object.keys(V.meshes)){if(k!=='ground'&&!used.has(k)){V.meshes[k].dispose();delete V.meshes[k]}}
    V.items=items;V.target=[0,d.H*.5,0];V.baseDist=d.H*2.55;if(!V.distSet){V.dist=V.baseDist;V.distSet=true}
    V.dirty=true;
  };
  V.detail=kind=>V.detailTex[kind]||(V.detailTex[kind]=R.texture(detailCanvas(kind),{repeat:true}));
  V.camera=(w,h)=>{const cp=Math.cos(V.pitch),pos=[V.target[0]+Math.sin(V.yaw)*cp*V.dist,V.target[1]+Math.sin(V.pitch)*V.dist,V.target[2]+Math.cos(V.yaw)*cp*V.dist];
    return {pos,view:M4.look(pos,V.target,[0,1,0]),proj:M4.persp(V.fov,w/h,.05,20)}};
  V.env=(cam)=>{const night=V.night;const L1=V3.norm([-.55,1,.75]);
    const c=V.target;const lp=V3.add(c,V3.scale(L1,3));const view=M4.look(lp,c,[0,1,0]);const pr=M4.ortho(-.9,.9,-.9,.9,.5,6);
    const head=V3.norm(V3.sub(cam.pos,V.target));
    return {bg:V.bg,shadowVP:M4.mul(pr,view),night,
      sky:night?[.03,.035,.05]:[.26,.26,.27],gnd:night?[.01,.01,.015]:[.12,.115,.11],
      L1,L2:night?head:V3.norm([.85,.35,.6]),L3:V3.norm([.2,.7,-1]),
      C1:night?[.05,.05,.07]:[1.25,1.2,1.12],C2:night?[.42,.42,.46]:[.36,.36,.38],C3:night?[.04,.04,.06]:[.5,.5,.55]}};
  V.draw=()=>{const dpr=Math.min(window.devicePixelRatio||1,2);const w=canvas.clientWidth||600,h=canvas.clientHeight||600;
    if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}
    const cam=V.camera(canvas.width,canvas.height);const env=V.env(cam);if(V.night)env.bg=[.035,.04,.055];
    R.render(V.items,cam,env);V.dirty=false};
  // 渲染循环（按需）
  let raf=0;const loop=()=>{raf=requestAnimationFrame(loop);let changed=false;
    if(Math.abs(V.open-V.openTarget)>.002){V.open+=(V.openTarget-V.open)*.18;if(Math.abs(V.open-V.openTarget)<.01)V.open=V.openTarget;V.rebuild&&V.rebuild();changed=true}
    if(V.anim){const a=V.anim;const t=Math.min(1,(performance.now()-a.t0)/a.dur),k=smooth(t);V.yaw=a.y0+(a.y1-a.y0)*k;V.pitch=a.p0+(a.p1-a.p0)*k;if(t>=1)V.anim=null;changed=true}
    if(V.auto&&!drag){V.yaw+=.006;changed=true}
    if(changed||V.dirty)V.draw();};
  loop();
  V.stop=()=>cancelAnimationFrame(raf);
  V.goView=(yaw,pitch=.08)=>{let y1=yaw;while(y1-V.yaw>Math.PI)y1-=2*Math.PI;while(y1-V.yaw<-Math.PI)y1+=2*Math.PI;V.anim={t0:performance.now(),dur:600,y0:V.yaw,y1,p0:V.pitch,p1:pitch}};
  // 指针交互
  let drag=false,lx=0,ly=0,pts=new Map(),pinch0=0,dist0=0;
  canvas.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId);drag=true;lx=e.clientX;ly=e.clientY;V.anim=null;
    if(pts.size===2){const [a,b]=[...pts.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);dist0=V.dist}});
  canvas.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()];const p=Math.hypot(a[0]-b[0],a[1]-b[1]);V.dist=Math.max(V.baseDist*.35,Math.min(V.baseDist*1.6,dist0*pinch0/p));V.dirty=true;return}
    if(!drag)return;V.yaw-=(e.clientX-lx)*.008;V.pitch=Math.max(-.35,Math.min(.9,V.pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY;V.dirty=true});
  const up=e=>{pts.delete(e.pointerId);if(pts.size===0)drag=false};
  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{e.preventDefault();V.zoom(e.deltaY>0?1.08:.93)},{passive:false});
  V.zoom=f=>{V.dist=Math.max(V.baseDist*.35,Math.min(V.baseDist*1.6,V.dist*f));V.dirty=true};
  V.snapshot=(yaw,pitch,w=900,h=1100)=>{ // 离屏取图
    const oy=V.yaw,op=V.pitch,od=V.dist,ow=canvas.width,oh=canvas.height,oa=V.auto;V.auto=false;
    V.yaw=yaw;V.pitch=pitch;V.dist=V.baseDist*.92;canvas.width=w;canvas.height=h;const cam=V.camera(w,h);R.render(V.items,cam,V.env(cam));
    const url=canvas.toDataURL('image/jpeg',.9);V.yaw=oy;V.pitch=op;V.dist=od;canvas.width=ow;canvas.height=oh;V.auto=oa;V.dirty=true;return url};
  new ResizeObserver(()=>{V.dirty=true}).observe(canvas);
  return V;
}

const LINING_LOOK={mesh:{rough:.8,spec:.08,sheen:.05,detail:'mesh',dStr:.9},taffeta:{rough:.32,spec:.45,sheen:.05,detail:'nylon',dStr:.25},fleece:{rough:.97,spec:.02,sheen:.6,detail:'fleece',dStr:.9},quilted:{rough:.4,spec:.35,sheen:.05,detail:'nylon',dStr:.3},print:{rough:.75,spec:.08,sheen:.05,detail:'knit',dStr:.4}};

// 细节法线贴图（平铺）
function detailCanvas(kind){
  const N=128,h=mkCanvas(N,N);const x=h.getContext('2d');x.fillStyle='#808080';x.fillRect(0,0,N,N);
  const rnd=mulberry(kind.length*977);
  if(kind==='ripstop'){x.fillStyle='#8c8c8c';for(let i=0;i<N;i+=4){x.globalAlpha=.25;x.fillRect(0,i,N,2)}x.globalAlpha=1;x.fillStyle='#b0b0b0';x.fillRect(0,0,N,5);x.fillRect(0,0,5,N);x.fillStyle='#d0d0d0';x.fillRect(0,64,N,4);x.fillRect(64,0,4,N)}
  else if(kind==='twill'){x.strokeStyle='#a8a8a8';x.lineWidth=3;for(let i=-N;i<N*2;i+=8){x.beginPath();x.moveTo(i,0);x.lineTo(i+N,N);x.stroke()}}
  else if(kind==='knit'){for(let j=0;j<N;j+=8)for(let i=0;i<N;i+=8){x.fillStyle='#a0a0a0';x.beginPath();x.ellipse(i+4,j+4,2.6,3.6,0,0,7);x.fill()}}
  else if(kind==='fleece'){const id=x.getImageData(0,0,N,N);for(let i=0;i<id.data.length;i+=4){const v=128+(rnd()-.5)*150;id.data[i]=id.data[i+1]=id.data[i+2]=v}x.putImageData(id,0,0);x.filter='blur(1.2px)';x.drawImage(h,0,0);x.filter='none'}
  else if(kind==='nylon'){x.strokeStyle='#8a8a8a';x.lineWidth=1;for(let i=0;i<N;i+=3){x.beginPath();x.moveTo(0,i+.5);x.lineTo(N,i+.5);x.stroke()}}
  else if(kind==='mesh'){x.fillStyle='#b4b4b4';x.fillRect(0,0,N,N);x.fillStyle='#3a3a3a';for(let j=0;j<N;j+=16)for(let i=0;i<N;i+=16){const o=(j/16)%2?8:0;x.beginPath();x.arc((i+o)%N+4,j+8,4.6,0,7);x.fill()}}
  return heightToNormal(h,kind==='fleece'?1.4:2.2);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const ox=out.getContext('2d'),od=ox.createImageData(w,h),o=od.data;const k=str/255;
  for(let y=0;y<h;y++){const ym=((y-1+h)%h)*w*4,yp=((y+1)%h)*w*4,yr=y*w*4;
    for(let x=0;x<w;x++){const xm=((x-1+w)%w)*4,xp=((x+1)%w)*4;
      const dx=(sd[yr+xp]-sd[yr+xm])*k,dy=(sd[yp+x*4]-sd[ym+x*4])*k;const il=1/Math.sqrt(dx*dx+dy*dy+1);const i=yr+x*4;
      o[i]=(-dx*il*.5+.5)*255;o[i+1]=(-dy*il*.5+.5)*255;o[i+2]=(il*.5+.5)*255;o[i+3]=255}}
  ox.putImageData(od,0,0);return out;
}

// ---------- 尺寸与成本 ----------
function sizeSpec(c){const d=dims(c),T=TYPES[c.type],e=T.ease*(d.H/1.06),m=c.meas;
  const fk={slim:.75,regular:1,roomy:1.3}[c.fit||'regular'],gr=c.growth||0;
  const easeCm=Math.round({hardshell:18,softshell:15,fleece:16,down:24,vest:16}[c.type]*fk+gr*2);
  const len=Math.round((d.neckBaseY-(d.crotchY-d.H*.012-gr*d.H*.01))*100+(c.hem==='droptail'?3.5:0)+2);
  const rows=[['后中衣长',len+(c.hem==='droptail'?' (后摆 +3.5)':''),'±1'],['成衣胸围',m.chest+easeCm,'±1.5'],['下摆围',m.chest+easeCm+4,'±1.5'],['肩宽',Math.round(d.shHalf*200+3),'±0.8']];
  if(c.type!=='vest')rows.push(['袖长（肩点起）',Math.round(m.sleeve+4+gr*1.5+(c.growCuff?1:0))+(c.growCuff?'（内藏放长 3）':''),'±1'],['袖口围（平量×2）',Math.round(2*Math.PI*(d.wristR+e*.6)*100+4),'±0.5']);
  else rows.push(['袖窿深',Math.round(d.armR*2*100+6),'±0.8']);
  if(c.collar==='hood')rows.push(['帽高',Math.round(d.hh*1.25*100),'±1'],['帽宽（平量）',Math.round(d.hh*.62*100+4),'±1']);else rows.push(['领高',Math.round(d.hh*.4*100),'±0.5']);
  rows.push(['领围',Math.round(2*Math.PI*(d.neckR+e*.62)*100+2),'±1']);
  return {code:bodyInfo(c).code,rows};
}
function costEstimate(c){const T=TYPES[c.type];const sf=Math.pow(c.meas.height/106,1.3);const L=[];
  L.push(['基础面料与车工',T.base*sf]);
  const tp={solid:0,yoke:10,classic:12,diagonal:18,tri:16,side:14,raglan:14,chevron:16,pop:6}[c.template];if(tp)L.push(['拼色裁片',tp]);
  L.push(['内衬',({mesh:18,taffeta:15,fleece:28,quilted:36,print:24})[c.lining]*sf]);
  if(c.zipType==='waterproof')L.push(['防水拉链',25]);if(c.zipFlap)L.push(['防风门襟',8]);if(c.bigPull)L.push(['大号拉片',3]);
  const pk={none:0,welt:20,high:20,flap:16,kangaroo:14}[c.handPocket];if(pk)L.push(['手袋',pk]);
  const cp={none:0,zipV:12,zipH:12,patch:8}[c.chestPocket];if(cp)L.push(['胸袋',cp]);if(c.sleevePocket&&c.type!=='vest')L.push(['袖袋',10]);
  if(c.type!=='vest')L.push(['袖口',({elastic:4,velcro:6,rib:8})[c.cuff]]);if(c.hem==='droptail')L.push(['后长下摆',3]);
  const rf=['band','back','piping'].filter(k=>c.refl[k]).length;if(rf)L.push(['反光材料',rf*6]);
  if(c.collar==='hood'){if(c.hoodBrim)L.push(['帽檐',6]);if(c.hoodDeco!=='none')L.push(['帽饰',10])}
  c.logos.forEach(l=>L.push([`标志 · ${METHODS[l.method][0]}`,METHODS[l.method][1]*Math.max(1,l.size/6)]));
  if(c.nameLabel)L.push(['姓名标',2]);
  return {lines:L,total:L.reduce((s,l)=>s+l[1],0)};
}

function loadLogoImg(file){if(!file.type.startsWith('image/')){toast('请选择图片文件');return}

    const url=c.toDataURL('image/png');const im2=new Image();im2.onload=()=>{snap();const L=cfg.logos[ui.logo];L.kind='image';L.img=url;L._im=im2;afterChange();toast('图片已放到衣服上')};im2.src=url};im.onerror=()=>toast('这张图片打不开，换一张试试');im.src=r.result};r.readAsDataURL(file)}
function importJSON(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.design||j;if(!d.type||!TYPES[d.type])throw 0;snap();cfg=normalize(d);restoreImgs();ui.docId=null;$('#dname').value=cfg.name;afterChange();toast('已导入设计文件')}catch(err){toast('文件格式不对：需要小衣间导出的设计文件')}};r.readAsText(file)}

  const main=r(bright);let acc1=r(dark),acc2=r(bright.filter(c=>c!==main));cfg.colors={...cfg.colors,main,acc1,acc2,trim:acc1,zip:r([acc1,'#23272b']),lining:r(light)};

  if(c.nameLabel)bom.push(['姓名标','织唛 5 × 2.4 cm，内容：'+esc(c.nameLabel),'白底','后领内侧']);

    [2,'门襟',`${OPTS.zipType.find(x=>x[0]===c.zipType)[1]}${c.zipFlap?'，外置防风门襟（右前片）带按扣':''}，拉链顶端防夹护片`],
    [3,'胸袋',OPTS.chestPocket.find(x=>x[0]===c.chestPocket)[1]],[4,'手袋',OPTS.handPocket.find(x=>x[0]===c.handPocket)[1]+(c.sleevePocket&&c.type!=='vest'?'；左袖拉链袋':'')],
    [5,'袖口',c.type==='vest'?'袖窿包边':OPTS.cuff.find(x=>x[0]===c.cuff)[1]],[6,'下摆',OPTS.hem.find(x=>x[0]===c.hem)[1]+'，内折明线'],
    ['—','反光',rf.length?rf.join('；'):'无'],['—','内衬',`${OPTS.lining.find(l=>l[0]===c.lining)[1]}，门襟与下摆内贴边用面料`]];

  const logos=c.logos.map(L=>`<tr><td><img class="lg" src="${logoCanvas(L,300).toDataURL()}" alt=""></td><td>${PLACES[L.place]}</td><td class="m">${L.size} cm 宽</td><td>${METHODS[L.method][0]}</td><td>${L.kind==='image'?'客户图片':esc((ICONS[L.icon]?.name||'')+(L.text?' + “'+L.text+'”':''))}</td><td>${ci(L.method==='reflective'?REFL_HEX:L.fg)}${L.shape!=='none'?' 底 '+ci(L.bg):''}</td></tr>`).join('');
  return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作单 ${no}</title>
<style>:root{--ink:#1c2626;--mut:#5f6a66;--line:#d5d9d1;--acc:#ff6a2b}*{box-sizing:border-box}body{margin:0;background:#f3f4f0;color:var(--ink);font:14px/1.6 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}

@media(max-width:640px){.flats{grid-template-columns:1fr}}@media print{body{background:#fff}.pg{padding:0}h2{break-after:avoid}.views,.flats,table{break-inside:avoid}}</style></head><body><div class="pg">
<div class="hd"><div><h1>童装定制制作单</h1><small>小衣间 LITTLE WEAR · 设计稿，打版前需复核</small></div><div class="m" style="text-align:right">${no}<br><small>${new Date().toLocaleString('zh-CN')}</small></div></div>
